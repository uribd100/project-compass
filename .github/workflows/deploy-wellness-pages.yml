name: Deploy wellness PWA to GitHub Pages

on:
  push:
    branches: [claude/practical-brahmagupta-qE5d7]
    paths:
      - "wellness/**"
      - ".github/workflows/deploy-wellness-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wellness/package-lock.json
      - run: npm ci
        working-directory: wellness
      - run: npm run build
        working-directory: wellness
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wellness/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
