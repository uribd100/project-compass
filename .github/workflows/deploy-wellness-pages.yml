name: Deploy wellness PWA to GitHub Pages

on:
  push:
    branches: [claude/practical-brahmagupta-qE5d7]
    paths:
      - "wellness/**"
      - ".github/workflows/deploy-wellness-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wellness/package-lock.json
      - run: npm ci
        working-directory: wellness
      - run: npm run build
        working-directory: wellness
      # Publish the built static site to the gh-pages branch.
      # This avoids the github-pages environment's branch restriction.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: wellness/dist
          publish_branch: gh-pages
