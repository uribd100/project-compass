<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Project Compass · משרטוט לבניין</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0a1322;
    font-family: 'Heebo', system-ui, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  .stage {
    position: fixed; inset: 0;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 30%, hsl(215 50% 18%) 0%, hsl(220 60% 8%) 70%);
  }
  .sky-stars {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 78% 22%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 35% 12%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 88% 8%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 22% 35%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 60% 32%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 5% 28%, rgba(255,255,255,0.4), transparent),
      radial-gradient(2px 2px at 95% 38%, rgba(180,210,255,0.5), transparent);
    opacity: 0.55;
  }
  svg.scene {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }

  /* Top toolbar - minimal */
  .toolbar {
    position: absolute; top: 16px; right: 20px; left: 20px; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    pointer-events: none;
  }
  .brand {
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 8px 14px;
    pointer-events: auto;
  }
  .brand .small {
    color: rgba(255,255,255,0.55);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-family: 'Space Mono', monospace;
  }
  .brand .big {
    font-weight: 600;
    font-size: 14px;
    margin-top: 2px;
  }

  .phase-label {
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    padding: 6px 14px;
    color: rgba(255,255,255,0.7);
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.1em;
    pointer-events: auto;
  }

  .progress {
    position: absolute; bottom: 18px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 6px;
    z-index: 5;
    pointer-events: none;
  }
  .progress span {
    display: block;
    width: 32px; height: 3px;
    background: rgba(255,255,255,0.12);
    border-radius: 2px;
    overflow: hidden;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="sky-stars"></div>

  <svg class="scene" id="scene" viewBox="-500 -350 1000 700" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="bp-grid-fine" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="hsl(200 80% 50% / 0.13)" stroke-width="0.5"/>
      </pattern>
      <pattern id="bp-grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
        <path d="M 100 0 L 0 0 0 100" fill="none" stroke="hsl(200 80% 60% / 0.22)" stroke-width="0.8"/>
      </pattern>

      <linearGradient id="wall-front" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="hsl(35 35% 80%)"/>
        <stop offset="100%" stop-color="hsl(30 30% 60%)"/>
      </linearGradient>
      <linearGradient id="wall-side-light" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="hsl(35 30% 70%)"/>
        <stop offset="100%" stop-color="hsl(30 25% 52%)"/>
      </linearGradient>
      <linearGradient id="wall-side-shade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="hsl(30 25% 48%)"/>
        <stop offset="100%" stop-color="hsl(25 20% 32%)"/>
      </linearGradient>
      <linearGradient id="wall-back" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="hsl(30 22% 42%)"/>
        <stop offset="100%" stop-color="hsl(25 18% 28%)"/>
      </linearGradient>
      <linearGradient id="wall-internal" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="hsl(30 18% 60%)"/>
        <stop offset="100%" stop-color="hsl(25 15% 42%)"/>
      </linearGradient>

      <linearGradient id="roof-front" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="hsl(15 50% 38%)"/>
        <stop offset="100%" stop-color="hsl(12 45% 26%)"/>
      </linearGradient>
      <linearGradient id="roof-back" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="hsl(12 40% 24%)"/>
        <stop offset="100%" stop-color="hsl(10 35% 16%)"/>
      </linearGradient>
      <linearGradient id="roof-gable" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="hsl(15 45% 32%)"/>
        <stop offset="100%" stop-color="hsl(12 40% 22%)"/>
      </linearGradient>

      <radialGradient id="window-lit" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="hsl(48 100% 88%)"/>
        <stop offset="60%" stop-color="hsl(45 95% 68%)"/>
        <stop offset="100%" stop-color="hsl(40 80% 50%)"/>
      </radialGradient>

      <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="hsl(218 50% 14%)"/>
        <stop offset="100%" stop-color="hsl(220 55% 9%)"/>
      </linearGradient>

      <radialGradient id="ground-shadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="rgba(0,0,0,0.55)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
      </radialGradient>
    </defs>

    <g id="world"></g>
  </svg>

  <div class="toolbar">
    <div class="brand">
      <div class="small">Project Compass</div>
      <div class="big">משרטוט · אל · בניין</div>
    </div>
    <div class="phase-label" id="phaseLabel">— SCHEMATIC —</div>
  </div>

  <div class="progress">
    <span id="dot-1"></span>
    <span id="dot-2"></span>
    <span id="dot-3"></span>
    <span id="dot-4"></span>
  </div>
</div>

<script>
(function () {
  'use strict';

  // Building footprint (X) x depth (Z), centered at origin. Wall height H.
  const W = 480, D = 280, H = 130, ROOF_H = 90;

  // Plan-view wall lines (centered): used both for the blueprint and as
  // bases of 3D walls. Each entry: [x1, z1, x2, z2, kind]
  const planLines = [
    [-W/2, -D/2,  W/2, -D/2, 'outer'], // 0: south (front)
    [ W/2, -D/2,  W/2,  D/2, 'outer'], // 1: east  (right)
    [ W/2,  D/2, -W/2,  D/2, 'outer'], // 2: north (back)
    [-W/2,  D/2, -W/2, -D/2, 'outer'], // 3: west  (left)
    [-W/2, 0,     W/2, 0,    'internal'],
    [-80, -D/2,  -80,  D/2,  'internal'],
    [ 120, -D/2,  120, D/2,  'internal'],
  ];

  const planOpenings = [
    { line: 0, t1: 0.46, t2: 0.54, type: 'door' },
    { line: 0, t1: 0.18, t2: 0.30, type: 'window' },
    { line: 0, t1: 0.70, t2: 0.82, type: 'window' },
    { line: 2, t1: 0.18, t2: 0.30, type: 'window' },
    { line: 2, t1: 0.70, t2: 0.82, type: 'window' },
    { line: 1, t1: 0.20, t2: 0.32, type: 'window' },
    { line: 1, t1: 0.68, t2: 0.80, type: 'window' },
    { line: 3, t1: 0.20, t2: 0.32, type: 'window' },
    { line: 3, t1: 0.68, t2: 0.80, type: 'window' },
  ];

  const roomLabels = [
    { x: -160, z: -70, text: 'סלון' },
    { x:   20, z: -70, text: 'מטבח' },
    { x:  180, z: -70, text: 'מרפסת' },
    { x: -160, z:  70, text: 'חדר שינה' },
    { x:   20, z:  70, text: 'חדר עבודה' },
    { x:  180, z:  70, text: 'שירותים' },
  ];

  // Rotate around X-axis by angle theta (camera tilt).
  // theta = 0 => top-down (looking straight down at floor)
  function project(x, y, z, theta) {
    const cy = Math.cos(theta), sy = Math.sin(theta);
    const ry = y * cy - z * sy;
    const rz = y * sy + z * cy;
    return { sx: x, sy: -ry, depth: rz };
  }
  function project3(p, theta) { return project(p[0], p[1], p[2], theta); }

  const SVG_NS = 'http://www.w3.org/2000/svg';
  const world = document.getElementById('world');

  function el(tag, attrs) {
    const e = document.createElementNS(SVG_NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  function drawPaperFloor(g, theta, blueprintOpacity) {
    const pad = 110;
    const corners = [
      [-W/2 - pad, 0, -D/2 - pad],
      [ W/2 + pad, 0, -D/2 - pad],
      [ W/2 + pad, 0,  D/2 + pad],
      [-W/2 - pad, 0,  D/2 + pad],
    ];
    const pts = corners.map(c => project3(c, theta));
    const polyStr = pts.map(p => `${p.sx.toFixed(1)},${p.sy.toFixed(1)}`).join(' ');

    g.appendChild(el('ellipse', {
      cx: 0,
      cy: -D/2 * Math.sin(theta) * 0.5 + 30,
      rx: (W/2 + 80),
      ry: (D/2 + 60) * Math.cos(theta),
      fill: 'url(#ground-shadow)',
      opacity: 0.65,
    }));

    g.appendChild(el('polygon', {
      points: polyStr,
      fill: 'url(#paper)',
      stroke: 'hsl(198 70% 35% / 0.55)',
      'stroke-width': '1',
    }));
    g.appendChild(el('polygon', {
      points: polyStr,
      fill: 'url(#bp-grid-fine)',
      opacity: 0.55,
    }));
    g.appendChild(el('polygon', {
      points: polyStr,
      fill: 'url(#bp-grid-major)',
      opacity: 0.55,
    }));

    if (blueprintOpacity > 0.05) {
      const tb = [
        [W/2 - 5, 0, D/2 - 5],
        [W/2 + 95, 0, D/2 - 5],
        [W/2 + 95, 0, D/2 + 55],
        [W/2 - 5, 0, D/2 + 55],
      ];
      const tbPts = tb.map(c => project3(c, theta));
      g.appendChild(el('polygon', {
        points: tbPts.map(p => `${p.sx.toFixed(1)},${p.sy.toFixed(1)}`).join(' '),
        fill: 'hsl(220 60% 6% / 0.6)',
        stroke: 'hsl(198 70% 55% / 0.7)',
        'stroke-width': '0.8',
        opacity: blueprintOpacity,
      }));
    }
  }

  function drawBlueprintLines(g, theta, blueprintOpacity, lineProgress) {
    if (blueprintOpacity < 0.02) return;
    const draws = [
      { pts: [[-W/2,0,-D/2],[ W/2,0,-D/2]], color: 'hsl(198 93% 75%)', sw: 1.6, t0: 0.00, t1: 0.10 },
      { pts: [[ W/2,0,-D/2],[ W/2,0, D/2]], color: 'hsl(198 93% 75%)', sw: 1.6, t0: 0.05, t1: 0.18 },
      { pts: [[ W/2,0, D/2],[-W/2,0, D/2]], color: 'hsl(198 93% 75%)', sw: 1.6, t0: 0.10, t1: 0.22 },
      { pts: [[-W/2,0, D/2],[-W/2,0,-D/2]], color: 'hsl(198 93% 75%)', sw: 1.6, t0: 0.15, t1: 0.26 },
      { pts: [[-W/2,0,0],[ W/2,0,0]],       color: 'hsl(198 93% 70%)', sw: 1.2, t0: 0.28, t1: 0.40 },
      { pts: [[-80,0,-D/2],[-80,0, D/2]],   color: 'hsl(198 93% 70%)', sw: 1.2, t0: 0.36, t1: 0.46 },
      { pts: [[ 120,0,-D/2],[ 120,0, D/2]], color: 'hsl(198 93% 70%)', sw: 1.2, t0: 0.42, t1: 0.52 },
    ];

    draws.forEach(d => {
      const a = project3(d.pts[0], theta);
      const b = project3(d.pts[1], theta);
      const k = Math.max(0, Math.min(1, (lineProgress - d.t0) / Math.max(0.001, d.t1 - d.t0)));
      if (k <= 0) return;
      const ex = a.sx + (b.sx - a.sx) * k;
      const ey = a.sy + (b.sy - a.sy) * k;
      g.appendChild(el('line', {
        x1: a.sx.toFixed(1), y1: a.sy.toFixed(1),
        x2: ex.toFixed(1),   y2: ey.toFixed(1),
        stroke: d.color,
        'stroke-width': d.sw,
        'stroke-linecap': 'round',
        opacity: blueprintOpacity,
      }));
    });

    if (lineProgress > 0.55) {
      const op = Math.min(1, (lineProgress - 0.55) / 0.15) * blueprintOpacity;
      planOpenings.forEach(o => {
        const ln = planLines[o.line];
        const x1 = ln[0], z1 = ln[1], x2 = ln[2], z2 = ln[3];
        const ax = x1 + (x2 - x1) * o.t1;
        const az = z1 + (z2 - z1) * o.t1;
        const bx = x1 + (x2 - x1) * o.t2;
        const bz = z1 + (z2 - z1) * o.t2;
        const A = project(ax, 0, az, theta);
        const B = project(bx, 0, bz, theta);
        if (o.type === 'window') {
          g.appendChild(el('line', {
            x1: A.sx, y1: A.sy, x2: B.sx, y2: B.sy,
            stroke: 'hsl(45 95% 70%)', 'stroke-width': 2.4, opacity: op,
            'stroke-linecap': 'round',
          }));
        } else {
          const rad = Math.hypot(B.sx - A.sx, B.sy - A.sy) / 2 * 1.6;
          g.appendChild(el('path', {
            d: `M ${A.sx.toFixed(1)} ${A.sy.toFixed(1)} A ${rad.toFixed(1)} ${rad.toFixed(1)} 0 0 1 ${B.sx.toFixed(1)} ${B.sy.toFixed(1)}`,
            stroke: 'hsl(45 95% 70%)', 'stroke-width': 1, fill: 'none', opacity: op * 0.7,
          }));
          g.appendChild(el('line', {
            x1: A.sx, y1: A.sy, x2: B.sx, y2: B.sy,
            stroke: 'hsl(45 95% 70%)', 'stroke-width': 2.4, opacity: op,
            'stroke-linecap': 'round',
          }));
        }
      });
    }

    if (lineProgress > 0.65) {
      const op = Math.min(1, (lineProgress - 0.65) / 0.15) * blueprintOpacity;
      const tl = project(-W/2, 0, -D/2 - 30, theta);
      const tr = project( W/2, 0, -D/2 - 30, theta);
      g.appendChild(el('line', {
        x1: tl.sx, y1: tl.sy, x2: tr.sx, y2: tr.sy,
        stroke: 'hsl(198 70% 80%)', 'stroke-width': 0.6, opacity: op * 0.8,
      }));
      const tm = project(0, 0, -D/2 - 35, theta);
      const txt = el('text', {
        x: tm.sx, y: tm.sy,
        'text-anchor': 'middle',
        'font-family': "'Space Mono', monospace",
        'font-size': 9,
        fill: 'hsl(198 80% 85%)',
        opacity: op,
      });
      txt.textContent = '12.40 מ';
      g.appendChild(txt);

      const sl = project(-W/2 - 30, 0, -D/2, theta);
      const sb = project(-W/2 - 30, 0,  D/2, theta);
      g.appendChild(el('line', {
        x1: sl.sx, y1: sl.sy, x2: sb.sx, y2: sb.sy,
        stroke: 'hsl(198 70% 80%)', 'stroke-width': 0.6, opacity: op * 0.8,
      }));
      const sm = project(-W/2 - 38, 0, 0, theta);
      const txt2 = el('text', {
        x: sm.sx, y: sm.sy,
        'text-anchor': 'middle',
        'font-family': "'Space Mono', monospace",
        'font-size': 9,
        fill: 'hsl(198 80% 85%)',
        opacity: op,
        transform: `rotate(-90 ${sm.sx} ${sm.sy})`,
      });
      txt2.textContent = '8.20 מ';
      g.appendChild(txt2);
    }

    if (lineProgress > 0.45) {
      const op = Math.min(1, (lineProgress - 0.45) / 0.18) * blueprintOpacity;
      roomLabels.forEach(r => {
        const p = project(r.x, 0, r.z, theta);
        const t = el('text', {
          x: p.sx, y: p.sy,
          'text-anchor': 'middle',
          'font-family': 'Heebo, sans-serif',
          'font-size': 12,
          'font-weight': 500,
          fill: 'hsl(198 80% 88%)',
          opacity: op,
        });
        t.textContent = r.text;
        g.appendChild(t);
      });
    }

    if (lineProgress > 0.7) {
      const op = Math.min(1, (lineProgress - 0.7) / 0.15) * blueprintOpacity;
      const a = project(W/2 + 50, 0, -D/2 + 30, theta);
      const b = project(W/2 + 50, 0, -D/2,      theta);
      g.appendChild(el('line', {
        x1: a.sx, y1: a.sy, x2: b.sx, y2: b.sy,
        stroke: 'hsl(45 95% 65%)', 'stroke-width': 1.5, opacity: op,
        'stroke-linecap': 'round',
      }));
      const t = el('text', {
        x: b.sx, y: b.sy - 4,
        'text-anchor': 'middle',
        'font-family': "'Space Mono', monospace",
        'font-size': 9,
        fill: 'hsl(45 95% 75%)',
        opacity: op,
      });
      t.textContent = 'N';
      g.appendChild(t);
    }
  }

  function buildPolys(theta, wallProg, roofProg) {
    const polys = [];
    const Hp = H * wallProg;

    if (wallProg > 0.02) {
      polys.push({
        type: 'slab',
        verts: [
          [-W/2 - 12, 2, -D/2 - 12],
          [ W/2 + 12, 2, -D/2 - 12],
          [ W/2 + 12, 2,  D/2 + 12],
          [-W/2 - 12, 2,  D/2 + 12],
        ],
        fill: 'hsl(220 12% 18%)',
        stroke: 'hsl(220 18% 28%)',
        sw: 0.6,
        opacity: Math.min(1, wallProg * 3),
      });
    }

    function addWall(line, faceColor, isInternal) {
      polys.push({
        type: 'wall',
        verts: [
          [line[0], 0,  line[1]],
          [line[2], 0,  line[3]],
          [line[2], Hp, line[3]],
          [line[0], Hp, line[1]],
        ],
        fill: faceColor,
        stroke: 'hsl(220 15% 8% / 0.6)',
        sw: 0.4,
        line,
        isInternal,
      });
    }

    addWall(planLines[0], 'url(#wall-front)',     false);
    addWall(planLines[1], 'url(#wall-side-light)',false);
    addWall(planLines[2], 'url(#wall-back)',      false);
    addWall(planLines[3], 'url(#wall-side-shade)',false);
    addWall(planLines[4], 'url(#wall-internal)',  true);
    addWall(planLines[5], 'url(#wall-internal)',  true);
    addWall(planLines[6], 'url(#wall-internal)',  true);

    if (roofProg > 0.001) {
      const rDrop = (1 - roofProg) * 60;
      const rH = H + ROOF_H * roofProg;
      const eo = 18;
      polys.push({
        type: 'roof',
        verts: [
          [-W/2 - eo, H - rDrop, -D/2 - eo],
          [ W/2 + eo, H - rDrop, -D/2 - eo],
          [ W/2 + eo, rH - rDrop, 0],
          [-W/2 - eo, rH - rDrop, 0],
        ],
        fill: 'url(#roof-front)',
        stroke: 'hsl(15 35% 16%)',
        sw: 0.6,
        opacity: roofProg,
      });
      polys.push({
        type: 'roof',
        verts: [
          [ W/2 + eo, H - rDrop,  D/2 + eo],
          [-W/2 - eo, H - rDrop,  D/2 + eo],
          [-W/2 - eo, rH - rDrop, 0],
          [ W/2 + eo, rH - rDrop, 0],
        ],
        fill: 'url(#roof-back)',
        stroke: 'hsl(15 35% 12%)',
        sw: 0.6,
        opacity: roofProg,
      });
      polys.push({
        type: 'roof',
        verts: [
          [-W/2, H - rDrop, -D/2],
          [-W/2, rH - rDrop, 0],
          [-W/2, H - rDrop,  D/2],
        ],
        fill: 'url(#roof-gable)',
        stroke: 'hsl(15 35% 14%)',
        sw: 0.6,
        opacity: roofProg,
      });
      polys.push({
        type: 'roof',
        verts: [
          [ W/2, H - rDrop, -D/2],
          [ W/2, H - rDrop,  D/2],
          [ W/2, rH - rDrop, 0],
        ],
        fill: 'url(#roof-gable)',
        stroke: 'hsl(15 35% 14%)',
        sw: 0.6,
        opacity: roofProg,
      });
      polys.push({
        type: 'ridge',
        verts: [
          [-W/2 - eo, rH - rDrop, 0],
          [ W/2 + eo, rH - rDrop, 0],
        ],
        stroke: 'hsl(20 60% 55%)',
        sw: 1.2,
        opacity: roofProg * 0.9,
      });
    }

    return polys;
  }

  function avgDepth(poly, theta) {
    let s = 0;
    poly.verts.forEach(v => { s += project3(v, theta).depth; });
    return s / poly.verts.length;
  }

  function renderFrame(state) {
    const { theta, blueprintOpacity, lineProgress, wallProg, roofProg, windowsLit, glow } = state;
    clear(world);

    const gFloor = el('g', {});
    drawPaperFloor(gFloor, theta, blueprintOpacity);
    world.appendChild(gFloor);

    const gPlan = el('g', {});
    drawBlueprintLines(gPlan, theta, blueprintOpacity, lineProgress);
    world.appendChild(gPlan);

    const polys = buildPolys(theta, wallProg, roofProg);
    polys.forEach(p => p._depth = avgDepth(p, theta));
    polys.sort((a, b) => a._depth - b._depth);

    const gBuilding = el('g', {});

    polys.forEach(p => {
      if (p.type === 'ridge') {
        const a = project3(p.verts[0], theta);
        const b = project3(p.verts[1], theta);
        gBuilding.appendChild(el('line', {
          x1: a.sx.toFixed(1), y1: a.sy.toFixed(1),
          x2: b.sx.toFixed(1), y2: b.sy.toFixed(1),
          stroke: p.stroke, 'stroke-width': p.sw,
          opacity: p.opacity ?? 1,
          'stroke-linecap': 'round',
        }));
        return;
      }
      const projected = p.verts.map(v => project3(v, theta));
      const pts = projected.map(q => `${q.sx.toFixed(1)},${q.sy.toFixed(1)}`).join(' ');
      gBuilding.appendChild(el('polygon', {
        points: pts,
        fill: p.fill,
        stroke: p.stroke,
        'stroke-width': p.sw,
        opacity: p.opacity ?? 1,
        'stroke-linejoin': 'miter',
      }));

      if (p.type === 'wall' && p.line && !p.isInternal && wallProg > 0.55) {
        const opacityOpening = Math.min(1, (wallProg - 0.55) / 0.25);
        const lineIdx = planLines.indexOf(p.line);
        planOpenings.forEach(o => {
          if (o.line !== lineIdx) return;
          const ln = p.line;
          const x1 = ln[0], z1 = ln[1], x2 = ln[2], z2 = ln[3];
          const ax = x1 + (x2 - x1) * o.t1;
          const az = z1 + (z2 - z1) * o.t1;
          const bx = x1 + (x2 - x1) * o.t2;
          const bz = z1 + (z2 - z1) * o.t2;

          const isDoor = o.type === 'door';
          const yLow = isDoor ? 4 : 30;
          const wallTop = H * wallProg;
          const yHigh = isDoor ? Math.min(wallTop, H - 22) : Math.min(wallTop, H - 28);
          if (yHigh - yLow < 6) return;

          const Apt = project(ax, yLow,  az, theta);
          const Bpt = project(bx, yLow,  bz, theta);
          const Cpt = project(bx, yHigh, bz, theta);
          const Dpt = project(ax, yHigh, az, theta);
          const ptsStr = `${Apt.sx},${Apt.sy} ${Bpt.sx},${Bpt.sy} ${Cpt.sx},${Cpt.sy} ${Dpt.sx},${Dpt.sy}`;

          if (isDoor) {
            gBuilding.appendChild(el('polygon', {
              points: ptsStr,
              fill: 'hsl(28 55% 22%)',
              stroke: 'hsl(28 55% 14%)',
              'stroke-width': 0.6,
              opacity: opacityOpening,
            }));
            const knobX = Apt.sx + (Bpt.sx - Apt.sx) * 0.75;
            const knobY = Apt.sy + (Dpt.sy - Apt.sy) * 0.55;
            gBuilding.appendChild(el('circle', {
              cx: knobX, cy: knobY, r: 1.5,
              fill: 'hsl(45 80% 60%)', opacity: opacityOpening,
            }));
            const cl = project(ax - 6, yHigh + 4, az, theta);
            const cr = project(bx + 6, yHigh + 4, bz, theta);
            const cl2 = project(ax - 6, yHigh + 9, az, theta);
            const cr2 = project(bx + 6, yHigh + 9, bz, theta);
            gBuilding.appendChild(el('polygon', {
              points: `${cl.sx},${cl.sy} ${cr.sx},${cr.sy} ${cr2.sx},${cr2.sy} ${cl2.sx},${cl2.sy}`,
              fill: 'hsl(15 40% 28%)', stroke: 'hsl(15 40% 16%)', 'stroke-width': 0.6,
              opacity: opacityOpening,
            }));
          } else {
            const lit = windowsLit;
            const fillStyle = lit ? 'url(#window-lit)' : 'hsl(210 35% 22%)';
            gBuilding.appendChild(el('polygon', {
              points: ptsStr,
              fill: fillStyle,
              stroke: 'hsl(30 25% 18%)',
              'stroke-width': 1,
              opacity: opacityOpening,
            }));
            const Mh1 = project((ax + bx) / 2, yLow,  (az + bz) / 2, theta);
            const Mh2 = project((ax + bx) / 2, yHigh, (az + bz) / 2, theta);
            const Mv1 = project(ax, (yLow + yHigh) / 2, az, theta);
            const Mv2 = project(bx, (yLow + yHigh) / 2, bz, theta);
            gBuilding.appendChild(el('line', {
              x1: Mh1.sx, y1: Mh1.sy, x2: Mh2.sx, y2: Mh2.sy,
              stroke: 'hsl(30 30% 18%)', 'stroke-width': 1, opacity: opacityOpening,
            }));
            gBuilding.appendChild(el('line', {
              x1: Mv1.sx, y1: Mv1.sy, x2: Mv2.sx, y2: Mv2.sy,
              stroke: 'hsl(30 30% 18%)', 'stroke-width': 1, opacity: opacityOpening,
            }));
            const sa = project(ax - 3, yLow - 2, az, theta);
            const sb = project(bx + 3, yLow - 2, bz, theta);
            const sc = project(bx + 3, yLow,    bz, theta);
            const sd = project(ax - 3, yLow,    az, theta);
            gBuilding.appendChild(el('polygon', {
              points: `${sa.sx},${sa.sy} ${sb.sx},${sb.sy} ${sc.sx},${sc.sy} ${sd.sx},${sd.sy}`,
              fill: 'hsl(30 25% 50%)', stroke: 'hsl(25 22% 28%)', 'stroke-width': 0.5,
              opacity: opacityOpening,
            }));
          }
        });
      }
    });

    world.appendChild(gBuilding);
  }

  const LOOP_MS = 24000;

  function easeInOut(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }

  function timeline(t) {
    // theta is rotation around X-axis. theta=π/2 is true top-down (looking
    // straight down at the floor); theta=π/3 (~60°) gives an isometric feel
    // where wall height is half-compressed on screen.
    // Negative angles tilt the building toward the viewer so +z is screen up
    // (north-up plan convention; building front faces the camera in iso view).
    const TOP = -Math.PI / 2;
    const ISO = -Math.PI / 3;
    const ISO_NEAR = lerp(TOP, ISO, 0.85);

    let theta, wallProg, roofProg, blueprintOpacity, lineProgress, windowsLit, glow;

    if (t < 0.20) {
      const k = t / 0.20;
      theta = TOP;
      wallProg = 0;
      roofProg = 0;
      blueprintOpacity = clamp01(t / 0.04);
      lineProgress = clamp01(k);
      windowsLit = false;
      glow = 0;
    } else if (t < 0.32) {
      const k = (t - 0.20) / 0.12;
      theta = lerp(TOP, ISO_NEAR, easeInOut(k));
      wallProg = lerp(0, 0.4, easeInOut(k));
      roofProg = 0;
      blueprintOpacity = lerp(1, 0.4, easeInOut(k));
      lineProgress = 1;
      windowsLit = false;
      glow = 0;
    } else if (t < 0.46) {
      const k = (t - 0.32) / 0.14;
      theta = lerp(ISO_NEAR, ISO, easeInOut(k));
      wallProg = lerp(0.4, 1, easeInOut(k));
      roofProg = clamp01((k - 0.45) / 0.55);
      blueprintOpacity = lerp(0.4, 0, k);
      lineProgress = 1;
      windowsLit = false;
      glow = 0;
    } else if (t < 0.55) {
      const k = (t - 0.46) / 0.09;
      theta = ISO;
      wallProg = 1;
      roofProg = 1;
      blueprintOpacity = 0;
      lineProgress = 1;
      windowsLit = k > 0.3;
      glow = clamp01((k - 0.3) / 0.7);
    } else if (t < 0.70) {
      const k = (t - 0.55) / 0.15;
      theta = ISO + Math.sin(k * Math.PI) * 0.04;
      wallProg = 1;
      roofProg = 1;
      blueprintOpacity = 0;
      lineProgress = 1;
      windowsLit = true;
      glow = 1;
    } else if (t < 0.83) {
      const k = (t - 0.70) / 0.13;
      theta = lerp(ISO, ISO_NEAR, easeInOut(k));
      roofProg = clamp01(1 - k * 1.6);
      wallProg = lerp(1, 0.2, clamp01((k - 0.3) / 0.7));
      blueprintOpacity = lerp(0, 0.5, easeInOut(k));
      lineProgress = 1;
      windowsLit = k < 0.2;
      glow = clamp01(1 - k * 1.6);
    } else if (t < 0.95) {
      const k = (t - 0.83) / 0.12;
      theta = lerp(ISO_NEAR, TOP, easeInOut(k));
      wallProg = lerp(0.2, 0, easeInOut(k));
      roofProg = 0;
      blueprintOpacity = lerp(0.5, 1, easeInOut(k));
      lineProgress = 1;
      windowsLit = false;
      glow = 0;
    } else {
      theta = TOP;
      wallProg = 0;
      roofProg = 0;
      blueprintOpacity = 1;
      lineProgress = 1;
      windowsLit = false;
      glow = 0;
    }

    return { theta, wallProg, roofProg, blueprintOpacity, lineProgress, windowsLit, glow };
  }

  function phaseLabel(t) {
    if (t < 0.20) return '— SCHEMATIC / שרטוט —';
    if (t < 0.32) return '— EXTRUDE / הקמת קירות —';
    if (t < 0.46) return '— ROOFING / גג —';
    if (t < 0.70) return '— BUILT / בנוי —';
    if (t < 0.85) return '— DECONSTRUCT / פירוק —';
    return '— SCHEMATIC / שרטוט —';
  }

  function setProgressDots(t) {
    const phaseEnds = [0.20, 0.46, 0.70, 1.00];
    for (let i = 1; i <= 4; i++) {
      const dot = document.getElementById('dot-' + i);
      const start = i === 1 ? 0 : phaseEnds[i - 2];
      const end = phaseEnds[i - 1];
      const k = clamp01((t - start) / Math.max(0.0001, end - start));
      let inner = dot.firstElementChild;
      if (!inner) {
        inner = document.createElement('i');
        inner.style.display = 'block';
        inner.style.height = '100%';
        inner.style.background = 'linear-gradient(90deg, hsl(198 93% 70%), hsl(45 95% 65%))';
        dot.appendChild(inner);
      }
      inner.style.width = (k * 100).toFixed(1) + '%';
    }
  }

  let startTime = null;
  function tick(now) {
    if (startTime === null) startTime = now;
    const t = ((now - startTime) % LOOP_MS) / LOOP_MS;
    const state = timeline(t);
    renderFrame(state);
    document.getElementById('phaseLabel').textContent = phaseLabel(t);
    setProgressDots(t);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

})();
</script>
</body>
</html>
