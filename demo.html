<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Project Compass · Blueprint to Building</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #050a14;
    font-family: 'Heebo', system-ui, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  canvas { display: block; }

  #loader {
    position: fixed; inset: 0;
    background: #050a14;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
    color: rgba(255,255,255,0.6);
    z-index: 100;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-family: 'Space Mono', monospace;
  }
  #loader.hidden { opacity: 0; pointer-events: none; transition: opacity 600ms; }
  .spinner {
    width: 28px; height: 28px;
    border: 2px solid rgba(125,211,252,0.15);
    border-top-color: hsl(198 93% 70%);
    border-radius: 50%;
    animation: spin 800ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toolbar {
    position: fixed; top: 16px; right: 20px; left: 20px;
    z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    pointer-events: none;
  }
  .brand {
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 8px 14px;
    pointer-events: auto;
  }
  .brand .small {
    color: rgba(255,255,255,0.55);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-family: 'Space Mono', monospace;
  }
  .brand .big { font-weight: 600; font-size: 14px; margin-top: 2px; }

  .phase-label {
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    padding: 6px 14px;
    color: rgba(255,255,255,0.7);
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.1em;
    pointer-events: auto;
    transition: opacity 300ms;
  }

  .progress {
    position: fixed; bottom: 18px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 6px;
    z-index: 5;
    pointer-events: none;
  }
  .progress span {
    display: block;
    width: 36px; height: 3px;
    background: rgba(255,255,255,0.10);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress span i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, hsl(198 93% 70%), hsl(45 95% 65%));
  }

  .vignette {
    position: fixed; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
    z-index: 4;
  }

  .error {
    position: fixed; inset: 0;
    background: #050a14;
    color: rgba(255,255,255,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    padding: 32px;
    text-align: center;
    font-size: 14px;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div>טוען סצנה תלת-מימדית</div>
  </div>

  <div class="toolbar">
    <div class="brand">
      <div class="small">Project Compass</div>
      <div class="big">משרטוט · אל · בניין</div>
    </div>
    <div class="phase-label" id="phaseLabel">— SCHEMATIC —</div>
  </div>

  <div class="progress">
    <span><i id="dot-1"></i></span>
    <span><i id="dot-2"></i></span>
    <span><i id="dot-3"></i></span>
    <span><i id="dot-4"></i></span>
  </div>

  <div class="vignette"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

(async function () {

  // ===== Renderer =====
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.insertBefore(renderer.domElement, document.body.firstChild);

  // ===== Scene + Camera =====
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a1424, 0.012);

  const camera = new THREE.PerspectiveCamera(
    32, window.innerWidth / window.innerHeight, 0.1, 600
  );

  // ===== Sky (gradient sphere) =====
  const skyMat = new THREE.ShaderMaterial({
    uniforms: {
      topColor:    { value: new THREE.Color(0x0a1428) },
      midColor:    { value: new THREE.Color(0x1a2a4a) },
      bottomColor: { value: new THREE.Color(0x4060a0) },
      offset:      { value: 30 },
      exponent:    { value: 0.5 },
    },
    vertexShader: `
      varying vec3 vWorldPos;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform vec3 topColor; uniform vec3 midColor; uniform vec3 bottomColor;
      uniform float offset; uniform float exponent;
      varying vec3 vWorldPos;
      void main() {
        float h = normalize(vWorldPos + vec3(0.0, offset, 0.0)).y;
        float t = clamp(h, 0.0, 1.0);
        vec3 c = mix(bottomColor, midColor, smoothstep(0.0, 0.55, t));
        c = mix(c, topColor, smoothstep(0.4, 1.0, pow(t, exponent)));
        gl_FragColor = vec4(c, 1.0);
      }
    `,
    side: THREE.BackSide,
    depthWrite: false,
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), skyMat);
  scene.add(sky);

  // ===== Stars =====
  const starGeom = new THREE.BufferGeometry();
  const starCount = 2400;
  const starPos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    const r = 250;
    const phi = Math.acos(1 - Math.random() * 1.05); // bias toward upper hemisphere
    const theta = 2 * Math.PI * Math.random();
    starPos[i*3]     = r * Math.sin(phi) * Math.cos(theta);
    starPos[i*3 + 1] = r * Math.cos(phi);
    starPos[i*3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  }
  starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({
    color: 0xffffff, size: 1.4, sizeAttenuation: false,
    transparent: true, opacity: 0, depthWrite: false,
  });
  const stars = new THREE.Points(starGeom, starMat);
  scene.add(stars);

  // ===== Lights =====
  const sun = new THREE.DirectionalLight(0xfff1d6, 2.2);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 120;
  sun.shadow.camera.left = -30;
  sun.shadow.camera.right = 30;
  sun.shadow.camera.top = 30;
  sun.shadow.camera.bottom = -30;
  sun.shadow.bias = -0.0002;
  sun.shadow.radius = 3;
  scene.add(sun);
  scene.add(sun.target);

  const hemi = new THREE.HemisphereLight(0x90b8e8, 0x202028, 0.6);
  scene.add(hemi);

  // Subtle moonlight (active at night)
  const moon = new THREE.DirectionalLight(0x8fa9d6, 0);
  moon.position.set(-15, 18, -10);
  scene.add(moon);

  // ===== Ground =====
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x3d5034, roughness: 0.95, metalness: 0,
  });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // ===== Blueprint plane (canvas texture overlay on the ground) =====
  const W = 24, D = 14;        // building footprint in world units
  const wallH = 4;
  const PLAN_W = 36, PLAN_D = 22; // visible blueprint paper

  function makeBlueprintCanvas(progress) {
    const C_W = 2048, C_H = 1280;
    const canvas = document.createElement('canvas');
    canvas.width = C_W; canvas.height = C_H;
    const ctx = canvas.getContext('2d');

    const grad = ctx.createRadialGradient(C_W/2, C_H/2, 100, C_W/2, C_H/2, C_W/1.5);
    grad.addColorStop(0, '#152844');
    grad.addColorStop(1, '#0a1730');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, C_W, C_H);

    const cx = C_W / 2, cy = C_H / 2;
    const px = C_W / PLAN_W;
    const py = C_H / PLAN_D;

    ctx.strokeStyle = 'rgba(125, 211, 252, 0.10)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= C_W; x += 28) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, C_H); ctx.stroke();
    }
    for (let y = 0; y <= C_H; y += 28) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(C_W, y); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(125, 211, 252, 0.22)';
    ctx.lineWidth = 1.4;
    for (let x = 0; x <= C_W; x += 140) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, C_H); ctx.stroke();
    }
    for (let y = 0; y <= C_H; y += 140) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(C_W, y); ctx.stroke();
    }

    // Frame
    ctx.strokeStyle = 'rgba(125, 211, 252, 0.55)';
    ctx.lineWidth = 2;
    ctx.strokeRect(40, 40, C_W - 80, C_H - 80);

    // Title block
    ctx.fillStyle = 'rgba(8, 22, 44, 0.85)';
    ctx.strokeStyle = 'rgba(125, 211, 252, 0.7)';
    ctx.lineWidth = 1.5;
    ctx.fillRect(C_W - 380, C_H - 200, 320, 140);
    ctx.strokeRect(C_W - 380, C_H - 200, 320, 140);
    ctx.fillStyle = 'rgba(189, 230, 253, 0.85)';
    ctx.font = 'bold 22px "Space Mono", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('PROJECT COMPASS', C_W - 360, C_H - 165);
    ctx.font = '16px "Space Mono", monospace';
    ctx.fillStyle = 'rgba(189, 230, 253, 0.55)';
    ctx.fillText('A-101 / FLOOR PLAN', C_W - 360, C_H - 138);
    ctx.fillText('SCALE 1:50', C_W - 360, C_H - 116);
    ctx.fillText('הרצליה · 2026', C_W - 360, C_H - 92);

    function L(x1, z1, x2, z2) {
      ctx.beginPath();
      ctx.moveTo(cx + x1*px, cy + z1*py);
      ctx.lineTo(cx + x2*px, cy + z2*py);
      ctx.stroke();
    }
    function partialL(x1, z1, x2, z2, k) {
      const X1 = cx + x1*px, Y1 = cy + z1*py;
      const X2 = cx + x2*px, Y2 = cy + z2*py;
      ctx.beginPath();
      ctx.moveTo(X1, Y1);
      ctx.lineTo(X1 + (X2-X1)*k, Y1 + (Y2-Y1)*k);
      ctx.stroke();
    }

    const lines = [
      // Outer (with door gap will be drawn separately)
      { from: [-W/2, -D/2], to: [ W/2, -D/2], t0: 0.00, t1: 0.10, w: 6, color: '#7dd3fc' },
      { from: [ W/2, -D/2], to: [ W/2,  D/2], t0: 0.05, t1: 0.18, w: 6, color: '#7dd3fc' },
      { from: [ W/2,  D/2], to: [-W/2,  D/2], t0: 0.10, t1: 0.22, w: 6, color: '#7dd3fc' },
      { from: [-W/2,  D/2], to: [-W/2, -D/2], t0: 0.15, t1: 0.26, w: 6, color: '#7dd3fc' },
      // Internal
      { from: [-W/2, 0], to: [ W/2, 0], t0: 0.30, t1: 0.42, w: 4, color: '#7dd3fc' },
      { from: [-4, -D/2], to: [-4,  D/2], t0: 0.36, t1: 0.46, w: 4, color: '#7dd3fc' },
      { from: [ 6, -D/2], to: [ 6,  D/2], t0: 0.40, t1: 0.50, w: 4, color: '#7dd3fc' },
    ];
    ctx.lineCap = 'round';
    lines.forEach(l => {
      const k = Math.max(0, Math.min(1, (progress - l.t0) / Math.max(0.001, l.t1 - l.t0)));
      if (k <= 0) return;
      ctx.lineWidth = l.w; ctx.strokeStyle = l.color;
      partialL(l.from[0], l.from[1], l.to[0], l.to[1], k);
    });

    // Door & windows symbols on outer wall (after walls drawn)
    if (progress > 0.55) {
      const op = Math.min(1, (progress - 0.55) / 0.10);
      ctx.globalAlpha = op;
      ctx.strokeStyle = '#fde68a';
      ctx.fillStyle = '#fde68a';
      ctx.lineWidth = 5;
      // Front door at center bottom (z = -D/2), 1.8m wide
      const dy = cy - D/2 * py;
      // Door swing arc + leaf
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(cx - 0.9 * px, dy);
      ctx.lineTo(cx + 0.9 * px, dy);
      ctx.stroke();
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(cx - 0.9 * px, dy, 1.8 * px, -Math.PI/2, 0);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx - 0.9 * px, dy);
      ctx.lineTo(cx - 0.9 * px, dy + 1.8 * py);
      ctx.stroke();
      // Windows: small rectangles on each wall
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#fde68a';
      const winSpec = [
        // [x, z, length, isHorizontal]
        [-8, -D/2, 1.6, true],
        [ 8, -D/2, 1.6, true],
        [-8,  D/2, 1.6, true],
        [ 1,  D/2, 1.6, true],
        [ 8,  D/2, 1.6, true],
        [-W/2, -3.5, 1.6, false],
        [-W/2,  3.5, 1.6, false],
        [ W/2, -3.5, 1.6, false],
        [ W/2,  3.5, 1.6, false],
      ];
      winSpec.forEach(([x, z, len, horiz]) => {
        ctx.beginPath();
        if (horiz) {
          ctx.moveTo(cx + (x - len/2)*px, cy + z*py);
          ctx.lineTo(cx + (x + len/2)*px, cy + z*py);
        } else {
          ctx.moveTo(cx + x*px, cy + (z - len/2)*py);
          ctx.lineTo(cx + x*px, cy + (z + len/2)*py);
        }
        ctx.stroke();
      });
      ctx.globalAlpha = 1;
    }

    // Room labels
    if (progress > 0.55) {
      const op = Math.min(1, (progress - 0.55) / 0.18);
      ctx.globalAlpha = op;
      ctx.fillStyle = 'rgba(186, 230, 253, 0.95)';
      ctx.font = '600 30px Heebo, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const labels = [
        ['סלון',     -8, -3.5],
        ['מטבח',      1, -3.5],
        ['מרפסת',     9, -3.5],
        ['חדר שינה', -8,  3.5],
        ['חדר עבודה', 1,  3.5],
        ['שירותים',   9,  3.5],
      ];
      labels.forEach(([txt, x, z]) => {
        ctx.fillText(txt, cx + x*px, cy + z*py);
      });
      ctx.globalAlpha = 1;
    }

    // Dimensions
    if (progress > 0.7) {
      const op = Math.min(1, (progress - 0.7) / 0.15);
      ctx.globalAlpha = op;
      ctx.strokeStyle = 'rgba(189, 230, 253, 0.7)';
      ctx.fillStyle = 'rgba(253, 230, 138, 0.95)';
      ctx.lineWidth = 1.2;
      ctx.font = '600 22px "Space Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // Top dim line
      const dimY = cy - (D/2 + 1.2) * py;
      ctx.beginPath();
      ctx.moveTo(cx - W/2 * px, dimY);
      ctx.lineTo(cx + W/2 * px, dimY);
      ctx.stroke();
      ctx.fillText('12.40 מ', cx, dimY - 18);
      // Side dim
      const dimX = cx - (W/2 + 1.2) * px;
      ctx.beginPath();
      ctx.moveTo(dimX, cy - D/2 * py);
      ctx.lineTo(dimX, cy + D/2 * py);
      ctx.stroke();
      ctx.save();
      ctx.translate(dimX - 18, cy);
      ctx.rotate(-Math.PI/2);
      ctx.fillText('8.20 מ', 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // North arrow
    if (progress > 0.75) {
      const op = Math.min(1, (progress - 0.75) / 0.15);
      ctx.globalAlpha = op;
      ctx.strokeStyle = 'rgba(253, 230, 138, 0.85)';
      ctx.fillStyle = 'rgba(253, 230, 138, 0.85)';
      ctx.lineWidth = 2;
      const ax = cx + (W/2 + 4) * px;
      const ay = cy;
      ctx.beginPath();
      ctx.arc(ax, ay, 26, 0, Math.PI*2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ax, ay - 22);
      ctx.lineTo(ax - 8, ay + 8);
      ctx.lineTo(ax, ay);
      ctx.lineTo(ax + 8, ay + 8);
      ctx.closePath();
      ctx.fill();
      ctx.font = 'bold 20px "Space Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('N', ax, ay - 38);
      ctx.globalAlpha = 1;
    }

    return canvas;
  }

  const blueprintCanvasEl = makeBlueprintCanvas(1);
  const blueprintTex = new THREE.CanvasTexture(blueprintCanvasEl);
  blueprintTex.colorSpace = THREE.SRGBColorSpace;
  blueprintTex.minFilter = THREE.LinearFilter;
  blueprintTex.magFilter = THREE.LinearFilter;
  blueprintTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  const blueprintMat = new THREE.MeshBasicMaterial({
    map: blueprintTex, transparent: true, opacity: 1,
    depthWrite: false, side: THREE.DoubleSide,
  });
  const blueprint = new THREE.Mesh(new THREE.PlaneGeometry(PLAN_W, PLAN_D), blueprintMat);
  blueprint.rotation.x = -Math.PI / 2;
  blueprint.position.y = 0.02;
  scene.add(blueprint);

  let lastBlueprintProgress = -1;
  function updateBlueprintProgress(p) {
    if (Math.abs(p - lastBlueprintProgress) < 0.005) return;
    lastBlueprintProgress = p;
    const c = makeBlueprintCanvas(p);
    blueprintTex.image = c;
    blueprintTex.needsUpdate = true;
  }

  // ===== Building =====
  const buildingGroup = new THREE.Group();
  scene.add(buildingGroup);

  // Foundation (always-on once built)
  const foundationMat = new THREE.MeshStandardMaterial({
    color: 0x3a3d44, roughness: 0.9, metalness: 0.05,
  });
  const foundation = new THREE.Mesh(
    new THREE.BoxGeometry(W + 1.2, 0.45, D + 1.2),
    foundationMat
  );
  foundation.position.y = 0.225;
  foundation.castShadow = true; foundation.receiveShadow = true;
  buildingGroup.add(foundation);

  // Walls — group whose scale.y animates from 0 (collapsed) to 1 (full)
  // Pivot at y = 0.45 (top of foundation) so walls grow upward.
  const wallsGroup = new THREE.Group();
  wallsGroup.position.y = 0.45;
  buildingGroup.add(wallsGroup);

  const wallMatFront = new THREE.MeshStandardMaterial({
    color: 0xd6c4a8, roughness: 0.85,
  });
  const wallMatSide = new THREE.MeshStandardMaterial({
    color: 0xc4b095, roughness: 0.88,
  });
  const wallMatBack = new THREE.MeshStandardMaterial({
    color: 0xb09a7d, roughness: 0.9,
  });
  const wallMatInner = new THREE.MeshStandardMaterial({
    color: 0xc8b9a5, roughness: 0.85,
  });
  const wallT = 0.3;

  // Each wall is centered at its midpoint with bottom at y=0 (in walls-group local).
  function addWall(geom, x, z, mat) {
    const m = new THREE.Mesh(geom, mat);
    m.position.set(x, wallH / 2, z);
    m.castShadow = true; m.receiveShadow = true;
    wallsGroup.add(m);
    return m;
  }
  // Outer walls
  addWall(new THREE.BoxGeometry(W + wallT, wallH, wallT),    0, -D/2, wallMatFront);
  addWall(new THREE.BoxGeometry(W + wallT, wallH, wallT),    0,  D/2, wallMatBack);
  addWall(new THREE.BoxGeometry(wallT, wallH, D + wallT),  -W/2,  0,  wallMatSide);
  addWall(new THREE.BoxGeometry(wallT, wallH, D + wallT),   W/2,  0,  wallMatSide);
  // Internal walls (slightly thinner)
  const wallTi = 0.18;
  addWall(new THREE.BoxGeometry(W, wallH, wallTi),     0, 0,    wallMatInner);
  addWall(new THREE.BoxGeometry(wallTi, wallH, D),    -4, 0,    wallMatInner);
  addWall(new THREE.BoxGeometry(wallTi, wallH, D),     6, 0,    wallMatInner);

  // Roof
  const roofGroup = new THREE.Group();
  buildingGroup.add(roofGroup);
  const roofMat = new THREE.MeshStandardMaterial({
    color: 0x6e3422, roughness: 0.7,
  });
  const overhang = 0.7;
  const ridgeY = wallH + 1.7;
  const wallTop = wallH + 0.45;
  const Wp = W/2 + overhang;
  const Dp = D/2 + overhang;
  const roofGeom = new THREE.BufferGeometry();
  const positions = new Float32Array([
    // front slope
    -Wp, wallTop, -Dp,
     Wp, wallTop, -Dp,
     Wp, ridgeY,  0,
    -Wp, ridgeY,  0,
    // back slope
     Wp, wallTop,  Dp,
    -Wp, wallTop,  Dp,
    -Wp, ridgeY,  0,
     Wp, ridgeY,  0,
    // left gable triangle (inside the eaves)
    -W/2 - 0.05, wallTop, -D/2 - 0.05,
    -W/2 - 0.05, ridgeY,  0,
    -W/2 - 0.05, wallTop,  D/2 + 0.05,
    // right gable triangle
     W/2 + 0.05, wallTop, -D/2 - 0.05,
     W/2 + 0.05, wallTop,  D/2 + 0.05,
     W/2 + 0.05, ridgeY,  0,
  ]);
  roofGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  roofGeom.setIndex([
    0,1,2, 0,2,3,
    4,5,6, 4,6,7,
    8,9,10,
    11,12,13,
  ]);
  roofGeom.computeVertexNormals();
  const roofMesh = new THREE.Mesh(roofGeom, roofMat);
  roofMesh.castShadow = true; roofMesh.receiveShadow = true;
  roofGroup.add(roofMesh);

  // Ridge beam highlight
  const ridgeBeam = new THREE.Mesh(
    new THREE.CylinderGeometry(0.07, 0.07, 2 * Wp, 8),
    new THREE.MeshStandardMaterial({ color: 0x8b4530, roughness: 0.6 })
  );
  ridgeBeam.rotation.z = Math.PI / 2;
  ridgeBeam.position.y = ridgeY;
  ridgeBeam.castShadow = true;
  roofGroup.add(ridgeBeam);

  // Chimney for character
  const chimney = new THREE.Mesh(
    new THREE.BoxGeometry(0.7, 1.4, 0.7),
    new THREE.MeshStandardMaterial({ color: 0xb0a89c, roughness: 0.8 })
  );
  chimney.position.set(W/2 - 4, ridgeY + 0.4, 0.4);
  chimney.castShadow = true; chimney.receiveShadow = true;
  roofGroup.add(chimney);

  roofGroup.position.y = 0;
  roofGroup.scale.set(1, 1, 1);

  // Windows (separate so we can scale them in after walls finish)
  const windowsGroup = new THREE.Group();
  buildingGroup.add(windowsGroup);

  const winGlassMat = new THREE.MeshStandardMaterial({
    color: 0x2a3848, emissive: 0xffd680, emissiveIntensity: 0,
    roughness: 0.2, metalness: 0.3,
  });
  const winFrameMat = new THREE.MeshStandardMaterial({
    color: 0x4a3826, roughness: 0.8,
  });
  const sillMat = new THREE.MeshStandardMaterial({
    color: 0x8a8a8a, roughness: 0.7,
  });

  function addWindow(x, y, z, rotY, w, h) {
    const g = new THREE.Group();
    // Glass
    const glass = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      winGlassMat.clone()
    );
    glass.position.z = 0.04;
    g.add(glass);
    // Frame
    const fr = 0.08;
    const fThk = 0.06;
    // Top, bottom, left, right of frame
    g.add(makeFrameSlat(w + fr*2, fThk, fThk, 0, h/2 + fr/2, 0));
    g.add(makeFrameSlat(w + fr*2, fThk, fThk, 0, -h/2 - fr/2, 0));
    g.add(makeFrameSlat(fThk, h, fThk, -w/2 - fr/2, 0, 0));
    g.add(makeFrameSlat(fThk, h, fThk,  w/2 + fr/2, 0, 0));
    // Cross
    g.add(makeFrameSlat(w, fThk*0.6, fThk*0.6, 0, 0, 0.01));
    g.add(makeFrameSlat(fThk*0.6, h, fThk*0.6, 0, 0, 0.01));
    // Sill
    const sill = new THREE.Mesh(
      new THREE.BoxGeometry(w + fr*4, 0.1, 0.32),
      sillMat
    );
    sill.position.set(0, -h/2 - 0.12, 0.12);
    sill.castShadow = true;
    g.add(sill);
    g.position.set(x, y, z);
    g.rotation.y = rotY;
    g.userData.glass = glass;
    windowsGroup.add(g);
    return g;
  }
  function makeFrameSlat(w, h, d, x, y, z) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), winFrameMat);
    m.position.set(x, y, z);
    m.castShadow = true;
    return m;
  }

  const wins = [];
  const winY = 2.0, winW = 1.6, winH = 1.4;
  // Front (faces -Z)
  wins.push(addWindow(-8, winY, -D/2 - 0.16, 0, winW, winH));
  wins.push(addWindow( 8, winY, -D/2 - 0.16, 0, winW, winH));
  // Back (faces +Z)
  wins.push(addWindow(-8, winY,  D/2 + 0.16, Math.PI, winW, winH));
  wins.push(addWindow( 1, winY,  D/2 + 0.16, Math.PI, winW, winH));
  wins.push(addWindow( 8, winY,  D/2 + 0.16, Math.PI, winW, winH));
  // Left (faces -X)
  wins.push(addWindow(-W/2 - 0.16, winY, -3.5, -Math.PI/2, winW, winH));
  wins.push(addWindow(-W/2 - 0.16, winY,  3.5, -Math.PI/2, winW, winH));
  // Right (faces +X)
  wins.push(addWindow( W/2 + 0.16, winY, -3.5,  Math.PI/2, winW, winH));
  wins.push(addWindow( W/2 + 0.16, winY,  3.5,  Math.PI/2, winW, winH));

  // Door
  const doorGroup = new THREE.Group();
  buildingGroup.add(doorGroup);
  const doorWidth = 1.8, doorHeight = 2.6;
  const doorLeaf = new THREE.Mesh(
    new THREE.BoxGeometry(doorWidth, doorHeight, 0.08),
    new THREE.MeshStandardMaterial({ color: 0x3a2410, roughness: 0.75 })
  );
  doorLeaf.position.set(0, 0.45 + doorHeight/2, -D/2 - 0.18);
  doorLeaf.castShadow = true;
  doorGroup.add(doorLeaf);
  const knob = new THREE.Mesh(
    new THREE.SphereGeometry(0.07, 12, 12),
    new THREE.MeshStandardMaterial({ color: 0xc89a3a, roughness: 0.3, metalness: 0.7 })
  );
  knob.position.set(0.65, 0.45 + doorHeight*0.5, -D/2 - 0.24);
  doorGroup.add(knob);
  const canopy = new THREE.Mesh(
    new THREE.BoxGeometry(2.6, 0.18, 0.9),
    new THREE.MeshStandardMaterial({ color: 0x4d2a1c, roughness: 0.7 })
  );
  canopy.position.set(0, 0.45 + doorHeight + 0.4, -D/2 - 0.5);
  canopy.castShadow = true;
  doorGroup.add(canopy);
  // Pathway
  const path = new THREE.Mesh(
    new THREE.BoxGeometry(2.0, 0.06, 5),
    new THREE.MeshStandardMaterial({ color: 0x6a6862, roughness: 0.95 })
  );
  path.position.set(0, 0.04, -D/2 - 3);
  path.receiveShadow = true;
  doorGroup.add(path);

  // Decorative trees (low-poly, give scale)
  function makeTree(x, z, scale = 1) {
    const tree = new THREE.Group();
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.22, 1.2, 8),
      new THREE.MeshStandardMaterial({ color: 0x4a2e1a, roughness: 0.95 })
    );
    trunk.position.y = 0.6;
    trunk.castShadow = true;
    tree.add(trunk);
    const leaves = new THREE.Mesh(
      new THREE.ConeGeometry(0.9, 2.4, 8),
      new THREE.MeshStandardMaterial({ color: 0x2c5a2c, roughness: 0.9 })
    );
    leaves.position.y = 2.0;
    leaves.castShadow = true;
    tree.add(leaves);
    tree.position.set(x, 0, z);
    tree.scale.setScalar(scale);
    return tree;
  }
  scene.add(makeTree(-W/2 - 5, -D/2 - 3, 1.1));
  scene.add(makeTree(-W/2 - 7, D/2 + 4, 0.9));
  scene.add(makeTree( W/2 + 6, -D/2 - 5, 1.0));
  scene.add(makeTree( W/2 + 8,  D/2 + 2, 1.2));

  // Interior lights (lit when night)
  const interiorLights = [];
  [
    [-8, 1.8, -3.5], [ 1, 1.8, -3.5], [ 9, 1.8, -3.5],
    [-8, 1.8,  3.5], [ 1, 1.8,  3.5], [ 9, 1.8,  3.5],
  ].forEach(([x, y, z]) => {
    const l = new THREE.PointLight(0xffd680, 0, 14, 1.4);
    l.position.set(x, y, z);
    buildingGroup.add(l);
    interiorLights.push(l);
  });

  // Initial state
  wallsGroup.scale.y = 0;
  roofGroup.position.y = 12;
  roofGroup.visible = false;
  doorGroup.scale.set(0, 0, 0);
  windowsGroup.children.forEach(w => w.scale.set(0, 0, 0));

  // ===== Post-processing =====
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.7, 0.5, 0.55
  );
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  // ===== Resize =====
  window.addEventListener('resize', () => {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    composer.setSize(w, h);
    bloom.resolution.set(w, h);
  });

  // ===== Animation timeline =====
  const LOOP_MS = 24000;

  function easeInOut(x) { return x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2) / 2; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function lerpColor(out, a, b, t) {
    out.r = a.r + (b.r - a.r) * t;
    out.g = a.g + (b.g - a.g) * t;
    out.b = a.b + (b.b - a.b) * t;
  }

  // Sky color presets
  const skyDay = {
    top: new THREE.Color(0x4d80c8),
    mid: new THREE.Color(0x8cb6e0),
    bot: new THREE.Color(0xc8d8e8),
  };
  const skyDusk = {
    top: new THREE.Color(0x2c3a78),
    mid: new THREE.Color(0xb86a48),
    bot: new THREE.Color(0xe89858),
  };
  const skyNight = {
    top: new THREE.Color(0x040816),
    mid: new THREE.Color(0x0a1430),
    bot: new THREE.Color(0x1a2444),
  };
  const skyBlueprint = {
    top: new THREE.Color(0x040816),
    mid: new THREE.Color(0x081428),
    bot: new THREE.Color(0x102040),
  };

  function pickSky(phase) {
    // phase: 0=blueprint, 1=dawn, 2=day, 3=dusk, 4=night
    if (phase <= 0) return skyBlueprint;
    if (phase >= 4) return skyNight;
    // For simplicity, interpolate between two presets
    return null;
  }

  let startTime = null;
  const tmpColorA = new THREE.Color();
  const tmpColorB = new THREE.Color();
  const tmpColorC = new THREE.Color();

  function tick(now) {
    if (startTime === null) startTime = now;
    const t = ((now - startTime) % LOOP_MS) / LOOP_MS;

    let camMode, blueprintAlpha, planProgress;
    let wallProg, roofY, roofVisible, doorScl, winScl, winEmiss, lightInt;
    let sunIntensity, sunDir, hemiInt, moonInt;
    let skyTop, skyMid, skyBot, starsAlpha, fogD, exposure;

    // Phases:
    // A: 0.00 - 0.18  Blueprint draws (top-down)
    // B: 0.18 - 0.32  Camera tilts down + walls extrude
    // C: 0.32 - 0.42  Roof drops + door + sun rises (dawn)
    // D: 0.42 - 0.50  Day held; camera orbits
    // E: 0.50 - 0.62  Sunset; sky turns dusk
    // F: 0.62 - 0.78  Night; windows lit, slow orbit, stars
    // G: 0.78 - 0.92  Sunrise → reverse to plan
    // H: 0.92 - 1.00  Hold blueprint, ready to loop

    if (t < 0.18) {
      const k = t / 0.18;
      camMode = { type: 'top', k };
      blueprintAlpha = clamp01(t * 30);
      planProgress = clamp01(k);
      wallProg = 0; roofY = 12; roofVisible = false;
      doorScl = 0; winScl = 0; winEmiss = 0; lightInt = 0;
      sunDir = { az: -Math.PI/4, el: 0.10 };
      sunIntensity = 0.05; hemiInt = 0.45; moonInt = 0.5;
      skyTop = skyBlueprint.top; skyMid = skyBlueprint.mid; skyBot = skyBlueprint.bot;
      starsAlpha = 0.7; fogD = 0.012; exposure = 0.95;
    } else if (t < 0.32) {
      const k = (t - 0.18) / 0.14;
      const ek = easeInOut(k);
      camMode = { type: 'tiltIn', k: ek };
      blueprintAlpha = lerp(1, 0, ek);
      planProgress = 1;
      wallProg = lerp(0, 1, ek);
      roofY = 12; roofVisible = false;
      doorScl = clamp01((k - 0.7) / 0.3);
      winScl = clamp01((k - 0.6) / 0.4);
      winEmiss = 0; lightInt = 0;
      sunDir = { az: -Math.PI/3, el: lerp(0.1, 0.32, ek) };
      sunIntensity = lerp(0.1, 1.4, ek);
      hemiInt = lerp(0.45, 0.7, ek);
      moonInt = lerp(0.5, 0.0, ek);
      lerpColor(tmpColorA, skyBlueprint.top, skyDawn().top, ek);
      lerpColor(tmpColorB, skyBlueprint.mid, skyDawn().mid, ek);
      lerpColor(tmpColorC, skyBlueprint.bot, skyDawn().bot, ek);
      skyTop = tmpColorA; skyMid = tmpColorB; skyBot = tmpColorC;
      starsAlpha = lerp(0.7, 0.0, ek);
      fogD = lerp(0.012, 0.005, ek);
      exposure = lerp(0.95, 1.05, ek);
    } else if (t < 0.42) {
      const k = (t - 0.32) / 0.10;
      const ek = easeInOut(k);
      camMode = { type: 'orbitLow', k };
      blueprintAlpha = 0;
      wallProg = 1;
      roofVisible = true;
      roofY = lerp(8, 0, ek);
      doorScl = 1;
      winScl = 1;
      winEmiss = 0; lightInt = 0;
      sunDir = { az: lerp(-Math.PI/3, -Math.PI/4, k), el: lerp(0.32, 0.55, ek) };
      sunIntensity = lerp(1.4, 2.4, ek);
      hemiInt = 0.7;
      moonInt = 0;
      const a = skyDawn(), b = skyDay;
      lerpColor(tmpColorA, a.top, b.top, ek);
      lerpColor(tmpColorB, a.mid, b.mid, ek);
      lerpColor(tmpColorC, a.bot, b.bot, ek);
      skyTop = tmpColorA; skyMid = tmpColorB; skyBot = tmpColorC;
      starsAlpha = 0;
      fogD = 0.005; exposure = 1.05;
    } else if (t < 0.50) {
      const k = (t - 0.42) / 0.08;
      camMode = { type: 'orbit', k, base: 0 };
      blueprintAlpha = 0;
      wallProg = 1; roofY = 0; roofVisible = true;
      doorScl = 1; winScl = 1; winEmiss = 0; lightInt = 0;
      sunDir = { az: lerp(-Math.PI/4, 0, k), el: 0.55 };
      sunIntensity = 2.4; hemiInt = 0.7; moonInt = 0;
      skyTop = skyDay.top; skyMid = skyDay.mid; skyBot = skyDay.bot;
      starsAlpha = 0; fogD = 0.005; exposure = 1.05;
    } else if (t < 0.62) {
      const k = (t - 0.50) / 0.12;
      const ek = easeInOut(k);
      camMode = { type: 'orbit', k, base: 0.3 };
      blueprintAlpha = 0;
      wallProg = 1; roofY = 0; roofVisible = true;
      doorScl = 1; winScl = 1;
      winEmiss = clamp01((k - 0.6) / 0.4) * 1.3;
      lightInt = clamp01((k - 0.6) / 0.4) * 1.2;
      sunDir = { az: lerp(0, Math.PI/3, k), el: lerp(0.55, 0.05, ek) };
      sunIntensity = lerp(2.4, 0.05, ek);
      hemiInt = lerp(0.7, 0.25, ek);
      moonInt = lerp(0, 0.4, ek);
      const a = skyDay, b = skyDusk;
      lerpColor(tmpColorA, a.top, b.top, ek);
      lerpColor(tmpColorB, a.mid, b.mid, ek);
      lerpColor(tmpColorC, a.bot, b.bot, ek);
      skyTop = tmpColorA; skyMid = tmpColorB; skyBot = tmpColorC;
      starsAlpha = clamp01((k - 0.7) / 0.3) * 0.4;
      fogD = lerp(0.005, 0.014, ek);
      exposure = lerp(1.05, 1.0, ek);
    } else if (t < 0.78) {
      const k = (t - 0.62) / 0.16;
      const ek = easeInOut(k);
      camMode = { type: 'orbit', k, base: 0.7 };
      blueprintAlpha = 0;
      wallProg = 1; roofY = 0; roofVisible = true;
      doorScl = 1; winScl = 1; winEmiss = 1.3; lightInt = 1.2;
      sunDir = { az: Math.PI/3, el: lerp(0.05, -0.1, ek) };
      sunIntensity = lerp(0.05, 0, ek);
      hemiInt = lerp(0.25, 0.18, ek);
      moonInt = lerp(0.4, 0.5, ek);
      const a = skyDusk, b = skyNight;
      lerpColor(tmpColorA, a.top, b.top, ek);
      lerpColor(tmpColorB, a.mid, b.mid, ek);
      lerpColor(tmpColorC, a.bot, b.bot, ek);
      skyTop = tmpColorA; skyMid = tmpColorB; skyBot = tmpColorC;
      starsAlpha = lerp(0.4, 0.85, ek);
      fogD = lerp(0.014, 0.018, ek);
      exposure = lerp(1.0, 0.95, ek);
    } else if (t < 0.92) {
      const k = (t - 0.78) / 0.14;
      const ek = easeInOut(k);
      camMode = { type: 'tiltOut', k: ek };
      blueprintAlpha = lerp(0, 1, clamp01((k - 0.5) * 2));
      planProgress = 1;
      wallProg = lerp(1, 0, clamp01((k - 0.3) / 0.5));
      roofVisible = ek < 0.4;
      roofY = lerp(0, 12, clamp01((k) / 0.4));
      doorScl = lerp(1, 0, clamp01((k - 0.2) / 0.3));
      winScl = lerp(1, 0, clamp01((k - 0.15) / 0.3));
      winEmiss = lerp(1.3, 0, clamp01(k * 2));
      lightInt = lerp(1.2, 0, clamp01(k * 2));
      sunDir = { az: -Math.PI/3, el: lerp(-0.1, 0.1, ek) };
      sunIntensity = lerp(0, 0.1, ek);
      hemiInt = lerp(0.18, 0.45, ek);
      moonInt = lerp(0.5, 0.5, ek);
      const a = skyNight, b = skyBlueprint;
      lerpColor(tmpColorA, a.top, b.top, ek);
      lerpColor(tmpColorB, a.mid, b.mid, ek);
      lerpColor(tmpColorC, a.bot, b.bot, ek);
      skyTop = tmpColorA; skyMid = tmpColorB; skyBot = tmpColorC;
      starsAlpha = lerp(0.85, 0.7, ek);
      fogD = lerp(0.018, 0.012, ek);
      exposure = lerp(0.95, 0.95, ek);
    } else {
      camMode = { type: 'top', k: 1 };
      blueprintAlpha = 1; planProgress = 1;
      wallProg = 0; roofY = 12; roofVisible = false;
      doorScl = 0; winScl = 0; winEmiss = 0; lightInt = 0;
      sunDir = { az: -Math.PI/4, el: 0.10 }; sunIntensity = 0.05;
      hemiInt = 0.45; moonInt = 0.5;
      skyTop = skyBlueprint.top; skyMid = skyBlueprint.mid; skyBot = skyBlueprint.bot;
      starsAlpha = 0.7; fogD = 0.012; exposure = 0.95;
    }

    // ----- Camera path -----
    const orbitAngle = (typeof camMode.base === 'number')
      ? (camMode.base + camMode.k) * Math.PI * 2 * 0.18
      : 0;
    if (camMode.type === 'top') {
      const k = camMode.k;
      // Pure top-down look at origin
      const dist = lerp(38, 38, k);
      camera.position.set(0.001, dist, 0.001); // tiny offset to avoid up-vector singularity
      camera.lookAt(0, 0, 0);
    } else if (camMode.type === 'tiltIn') {
      const k = camMode.k;
      // From (0, 38, 0) top-down to (~22, 18, 22) iso angle
      const dist = lerp(38, 28, k);
      const elev = lerp(Math.PI/2, Math.PI/2 - 0.85, k); // from 90° down toward iso
      const azim = lerp(0, -Math.PI/4, k); // start centered, swing slightly to right
      const x = Math.cos(elev) * Math.cos(azim) * dist;
      const z = Math.cos(elev) * Math.sin(azim) * dist;
      const y = Math.sin(elev) * dist;
      camera.position.set(x, y + 2, z);
      camera.lookAt(0, 2 + k * 1, 0);
    } else if (camMode.type === 'orbitLow') {
      const k = camMode.k;
      const elev = lerp(Math.PI/2 - 0.85, Math.PI/2 - 1.0, k);
      const azim = -Math.PI/4 - k * 0.3;
      const dist = lerp(28, 26, k);
      camera.position.set(
        Math.cos(elev) * Math.cos(azim) * dist,
        Math.sin(elev) * dist + 3,
        Math.cos(elev) * Math.sin(azim) * dist
      );
      camera.lookAt(0, 3, 0);
    } else if (camMode.type === 'orbit') {
      const k = camMode.k;
      const baseAng = camMode.base ?? 0;
      const elev = Math.PI/2 - 1.05;
      const azim = baseAng * Math.PI * 2 - Math.PI/4 - k * 0.4;
      const dist = 26;
      camera.position.set(
        Math.cos(elev) * Math.cos(azim) * dist,
        Math.sin(elev) * dist + 3.2,
        Math.cos(elev) * Math.sin(azim) * dist
      );
      camera.lookAt(0, 3, 0);
    } else if (camMode.type === 'tiltOut') {
      const k = camMode.k;
      const elev = lerp(Math.PI/2 - 1.0, Math.PI/2, k);
      const azim = lerp(-Math.PI/2, 0, k);
      const dist = lerp(26, 38, k);
      const ec = Math.cos(elev), es = Math.sin(elev);
      camera.position.set(
        ec * Math.cos(azim) * dist + 0.001,
        es * dist + 2 * (1 - k),
        ec * Math.sin(azim) * dist + 0.001
      );
      camera.lookAt(0, lerp(3, 0, k), 0);
    }

    // ----- Apply scene state -----
    blueprint.material.opacity = blueprintAlpha;
    if (planProgress !== undefined && blueprintAlpha > 0.01) {
      updateBlueprintProgress(planProgress);
    }

    wallsGroup.scale.y = Math.max(0.0001, wallProg);
    wallsGroup.visible = wallProg > 0.01;

    roofGroup.position.y = roofY;
    roofGroup.visible = roofVisible;

    doorGroup.scale.setScalar(doorScl);
    doorGroup.visible = doorScl > 0.01;

    windowsGroup.children.forEach(g => {
      g.scale.setScalar(winScl);
      if (g.userData.glass) {
        g.userData.glass.material.emissiveIntensity = winEmiss;
      }
    });
    interiorLights.forEach(l => l.intensity = lightInt);

    // Sun position from spherical (az, el)
    const sx = Math.cos(sunDir.el) * Math.cos(sunDir.az) * 50;
    const sy = Math.sin(sunDir.el) * 50;
    const sz = Math.cos(sunDir.el) * Math.sin(sunDir.az) * 50;
    sun.position.set(sx, Math.max(sy, -5), sz);
    sun.target.position.set(0, 0, 0);
    sun.intensity = sunIntensity;
    hemi.intensity = hemiInt;
    moon.intensity = moonInt;

    skyMat.uniforms.topColor.value.copy(skyTop);
    skyMat.uniforms.midColor.value.copy(skyMid);
    skyMat.uniforms.bottomColor.value.copy(skyBot);
    starMat.opacity = starsAlpha;
    scene.fog.density = fogD;
    renderer.toneMappingExposure = exposure;

    // Update HUD
    setPhaseLabel(t);
    setProgressDots(t);

    composer.render();
    requestAnimationFrame(tick);
  }

  function skyDawn() {
    return {
      top: new THREE.Color(0x2c3a78),
      mid: new THREE.Color(0x8e7e9c),
      bot: new THREE.Color(0xd6a070),
    };
  }

  function setPhaseLabel(t) {
    const el = document.getElementById('phaseLabel');
    let txt;
    if (t < 0.18) txt = '— SCHEMATIC / שרטוט —';
    else if (t < 0.32) txt = '— EXTRUDE / הקמת קירות —';
    else if (t < 0.42) txt = '— ROOFING / גג —';
    else if (t < 0.50) txt = '— DAYLIGHT / יום —';
    else if (t < 0.62) txt = '— SUNSET / שקיעה —';
    else if (t < 0.78) txt = '— NIGHT / לילה —';
    else if (t < 0.92) txt = '— DAWN / שחר —';
    else txt = '— SCHEMATIC / שרטוט —';
    if (el.textContent !== txt) el.textContent = txt;
  }

  function setProgressDots(t) {
    const phaseEnds = [0.18, 0.42, 0.78, 1.00];
    for (let i = 1; i <= 4; i++) {
      const inner = document.getElementById('dot-' + i);
      const start = i === 1 ? 0 : phaseEnds[i - 2];
      const end = phaseEnds[i - 1];
      const k = clamp01((t - start) / Math.max(0.0001, end - start));
      inner.style.width = (k * 100).toFixed(1) + '%';
    }
  }

  // Hide loader, start
  document.getElementById('loader').classList.add('hidden');
  requestAnimationFrame(tick);

})().catch(err => {
  console.error(err);
  const e = document.createElement('div');
  e.className = 'error';
  e.innerHTML = '<div>אירעה שגיאה בטעינת הסצנה התלת־מימדית.<br/>פרטים בקונסולת הדפדפן.</div>';
  document.body.appendChild(e);
});
</script>
</body>
</html>
