<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Project Compass · Tower 12 — Blueprint to Building</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #050a14;
    font-family: 'Heebo', system-ui, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  canvas { display: block; }

  #loader {
    position: fixed; inset: 0;
    background: #050a14;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
    color: rgba(255,255,255,0.6);
    z-index: 100;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-family: 'Space Mono', monospace;
  }
  #loader.hidden { opacity: 0; pointer-events: none; transition: opacity 600ms; }
  .spinner {
    width: 28px; height: 28px;
    border: 2px solid rgba(125,211,252,0.15);
    border-top-color: hsl(198 93% 70%);
    border-radius: 50%;
    animation: spin 800ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toolbar {
    position: fixed; top: 16px; right: 20px; left: 20px;
    z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    pointer-events: none;
  }
  .brand {
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 8px 14px;
    pointer-events: auto;
  }
  .brand .small {
    color: rgba(255,255,255,0.55);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-family: 'Space Mono', monospace;
  }
  .brand .big { font-weight: 600; font-size: 14px; margin-top: 2px; }

  .phase-label {
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    padding: 6px 14px;
    color: rgba(255,255,255,0.7);
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.1em;
    pointer-events: auto;
    transition: opacity 300ms;
  }

  .progress {
    position: fixed; bottom: 18px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 6px;
    z-index: 5;
    pointer-events: none;
  }
  .progress span {
    display: block;
    width: 36px; height: 3px;
    background: rgba(255,255,255,0.10);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress span i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, hsl(198 93% 70%), hsl(45 95% 65%));
  }

  .vignette {
    position: fixed; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
    z-index: 4;
  }

  .error {
    position: fixed; inset: 0;
    background: #050a14;
    color: rgba(255,255,255,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    padding: 32px;
    text-align: center;
    font-size: 14px;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div>טוען מגדל 12 קומות</div>

      <div class="small">Project Compass · Tower 12</div>

  <div class="progress">
    <span><i id="dot-1"></i></span>

  <div class="vignette"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

(async function () {
  // ============================================================
  // Constants
  // ============================================================
  const FLOORS = 12;
  const FLOOR_H = 3.2;
  const TOTAL_H = FLOORS * FLOOR_H;   // 38.4 m
  const W = 30;                        // building width (X)
  const D = 16;                        // building depth (Z)
  const PLAN_W = 44;                   // visible blueprint paper width
  const PLAN_D = 26;                   // visible blueprint paper depth
  const LOOP_MS = 24000;

  // ============================================================
  // Renderer
  // ============================================================
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.localClippingEnabled = true;
  document.body.insertBefore(renderer.domElement, document.body.firstChild);

  // ============================================================
  // Scene + Camera
  // ============================================================
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a1424, 0.008);

  const camera = new THREE.PerspectiveCamera(
    32, window.innerWidth / window.innerHeight, 0.1, 800
  );

  // ============================================================
  // Sky
  // ============================================================
  const skyMat = new THREE.ShaderMaterial({
    uniforms: {
      topColor:    { value: new THREE.Color(0x0a1428) },
      midColor:    { value: new THREE.Color(0x1a2a4a) },
      bottomColor: { value: new THREE.Color(0x4060a0) },
      offset:      { value: 30 },
      exponent:    { value: 0.5 },
    },
    vertexShader: `
      varying vec3 vWorldPos;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform vec3 topColor; uniform vec3 midColor; uniform vec3 bottomColor;
      uniform float offset; uniform float exponent;
      varying vec3 vWorldPos;
      void main() {
        float h = normalize(vWorldPos + vec3(0.0, offset, 0.0)).y;
        float t = clamp(h, 0.0, 1.0);
        vec3 c = mix(bottomColor, midColor, smoothstep(0.0, 0.55, t));
        c = mix(c, topColor, smoothstep(0.4, 1.0, pow(t, exponent)));
        gl_FragColor = vec4(c, 1.0);
      }
    `,
    side: THREE.BackSide,
    depthWrite: false,
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(380, 32, 16), skyMat);
  scene.add(sky);

  // Stars
  const starGeom = new THREE.BufferGeometry();
  const starCount = 2800;
  const starPos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    const r = 320;
    const phi = Math.acos(1 - Math.random() * 1.05);
    const theta = 2 * Math.PI * Math.random();
    starPos[i*3]     = r * Math.sin(phi) * Math.cos(theta);
    starPos[i*3 + 1] = r * Math.cos(phi);
    starPos[i*3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  }
  starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({
    color: 0xffffff, size: 1.5, sizeAttenuation: false,
    transparent: true, opacity: 0, depthWrite: false,
  });
  const stars = new THREE.Points(starGeom, starMat);
  scene.add(stars);

  // ============================================================
  // Lights
  // ============================================================
  const sun = new THREE.DirectionalLight(0xfff1d6, 2.2);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 180;
  sun.shadow.camera.left = -50;
  sun.shadow.camera.right = 50;
  sun.shadow.camera.top = 60;
  sun.shadow.camera.bottom = -50;
  sun.shadow.bias = -0.0002;
  sun.shadow.radius = 3;
  scene.add(sun);
  scene.add(sun.target);

  const hemi = new THREE.HemisphereLight(0x90b8e8, 0x202028, 0.6);
  scene.add(hemi);

  const moon = new THREE.DirectionalLight(0x8fa9d6, 0);
  moon.position.set(-25, 30, -15);
  scene.add(moon);

  // ============================================================
  // Ground (street + sidewalk + grass)
  // ============================================================
  function makeGroundCanvas() {
    const c = document.createElement('canvas');
    c.width = 2048; c.height = 2048;
    const ctx = c.getContext('2d');
    // Grass base
    ctx.fillStyle = '#3d5034';
    ctx.fillRect(0, 0, c.width, c.height);
    // Subtle noise via tiny colored squares
    for (let i = 0; i < 4000; i++) {
      const x = Math.random() * c.width;
      const y = Math.random() * c.height;
      const r = 1 + Math.random() * 2;
      ctx.fillStyle = `rgba(${50 + Math.random()*40}, ${80 + Math.random()*40}, ${50 + Math.random()*30}, 0.6)`;
      ctx.fillRect(x, y, r, r);
    }
    // Sidewalk ring around building footprint (centered, building is 30x16)
    // Mapping: ground plane is 200x200 m centered, canvas is 2048x2048
    // pixels per meter: 2048/200 = 10.24
    const pm = c.width / 200;
    const cx = c.width/2, cy = c.height/2;
    // Sidewalk: 4m wide ring around building footprint
    ctx.fillStyle = '#aaaaaa';
    const halfW = (W/2 + 5) * pm, halfD = (D/2 + 5) * pm;
    ctx.fillRect(cx - halfW, cy - halfD, halfW*2, halfD*2);
    // Sidewalk noise
    ctx.fillStyle = 'rgba(160, 160, 160, 0.55)';
    ctx.fillRect(cx - halfW, cy - halfD, halfW*2, halfD*2);
    for (let i = 0; i < 600; i++) {
      const x = cx - halfW + Math.random() * halfW*2;
      const y = cy - halfD + Math.random() * halfD*2;
      ctx.fillStyle = `rgba(${130 + Math.random()*40}, ${130 + Math.random()*40}, ${130 + Math.random()*40}, 0.5)`;
      ctx.fillRect(x, y, 2, 2);
    }
    // Building footprint cutout (replaced by foundation later)
    ctx.fillStyle = '#2a2c30';
    const halfWB = (W/2 + 0.6) * pm, halfDB = (D/2 + 0.6) * pm;
    ctx.fillRect(cx - halfWB, cy - halfDB, halfWB*2, halfDB*2);
    // Sidewalk tile lines
    ctx.strokeStyle = 'rgba(95, 95, 95, 0.55)';
    ctx.lineWidth = 1.5;
    for (let x = -50; x <= 50; x += 4) {
      const sx = cx + x * pm;
      if (Math.abs(x) < W/2 + 0.6) continue;
      ctx.beginPath(); ctx.moveTo(sx, cy - halfD); ctx.lineTo(sx, cy + halfD); ctx.stroke();
    }
    for (let z = -30; z <= 30; z += 4) {
      const sy = cy + z * pm;
      if (Math.abs(z) < D/2 + 0.6) continue;
      ctx.beginPath(); ctx.moveTo(cx - halfW, sy); ctx.lineTo(cx + halfW, sy); ctx.stroke();
    }
    // Asphalt streets along edges
    ctx.fillStyle = '#1f2024';
    ctx.fillRect(0, cy - halfD - 22*pm, c.width, 18*pm);
    ctx.fillRect(0, cy + halfD + 4*pm, c.width, 18*pm);
    ctx.fillRect(cx - halfW - 22*pm, 0, 18*pm, c.height);
    ctx.fillRect(cx + halfW + 4*pm, 0, 18*pm, c.height);
    // Lane markings
    ctx.strokeStyle = '#e6e6e6';
    ctx.setLineDash([20, 30]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, cy - halfD - 13*pm); ctx.lineTo(c.width, cy - halfD - 13*pm);
    ctx.moveTo(0, cy + halfD + 13*pm); ctx.lineTo(c.width, cy + halfD + 13*pm);
    ctx.stroke();
    ctx.setLineDash([]);
    return c;
  }
  const groundTex = new THREE.CanvasTexture(makeGroundCanvas());
  groundTex.colorSpace = THREE.SRGBColorSpace;
  groundTex.minFilter = THREE.LinearFilter;
  groundTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const groundMat = new THREE.MeshStandardMaterial({
    map: groundTex, roughness: 0.95, metalness: 0,
  });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // ============================================================
  // Architectural plan (canvas) with FURNITURE
  // ============================================================
  function makePlanCanvas(progress) {
    const C_W = 4096, C_H = 2400;
    const canvas = document.createElement('canvas');
    canvas.width = C_W; canvas.height = C_H;
    const ctx = canvas.getContext('2d');

    // Paper background
    const grad = ctx.createRadialGradient(C_W/2, C_H/2, 100, C_W/2, C_H/2, C_W/1.5);
    grad.addColorStop(0, '#152844');
    grad.addColorStop(1, '#0a1730');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, C_W, C_H);

    const cx = C_W / 2, cy = C_H / 2;
    const px = C_W / PLAN_W;     // pixels per meter X
    const py = C_H / PLAN_D;     // pixels per meter Z

    // Helpers
    function wx(x) { return cx + x * px; }
    function wy(z) { return cy + z * py; }
    function W2P(x, z) { return [wx(x), wy(z)]; }

    // Grid (fine + major)
    ctx.strokeStyle = 'rgba(125, 211, 252, 0.10)';
    ctx.lineWidth = 1;
    const fine = 0.5;  // 0.5m
    for (let x = -PLAN_W/2; x <= PLAN_W/2; x += fine) {
      ctx.beginPath(); ctx.moveTo(wx(x), 0); ctx.lineTo(wx(x), C_H); ctx.stroke();
    }
    for (let z = -PLAN_D/2; z <= PLAN_D/2; z += fine) {
      ctx.beginPath(); ctx.moveTo(0, wy(z)); ctx.lineTo(C_W, wy(z)); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(125, 211, 252, 0.22)';
    ctx.lineWidth = 1.4;
    for (let x = -PLAN_W/2; x <= PLAN_W/2; x += 2.5) {
      ctx.beginPath(); ctx.moveTo(wx(x), 0); ctx.lineTo(wx(x), C_H); ctx.stroke();
    }
    for (let z = -PLAN_D/2; z <= PLAN_D/2; z += 2.5) {
      ctx.beginPath(); ctx.moveTo(0, wy(z)); ctx.lineTo(C_W, wy(z)); ctx.stroke();
    }
    // Outer frame
    ctx.strokeStyle = 'rgba(125, 211, 252, 0.55)';
    ctx.lineWidth = 3;
    ctx.strokeRect(60, 60, C_W - 120, C_H - 120);

    // Title block
    ctx.fillStyle = 'rgba(8, 22, 44, 0.85)';
    ctx.strokeStyle = 'rgba(125, 211, 252, 0.7)';
    ctx.lineWidth = 2;
    ctx.fillRect(C_W - 720, C_H - 320, 640, 240);
    ctx.strokeRect(C_W - 720, C_H - 320, 640, 240);
    ctx.fillStyle = 'rgba(189, 230, 253, 0.92)';
    ctx.font = 'bold 38px "Space Mono", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('PROJECT COMPASS', C_W - 690, C_H - 260);
    ctx.font = '24px "Space Mono", monospace';
    ctx.fillStyle = 'rgba(189, 230, 253, 0.6)';
    ctx.fillText('A-201 / TYPICAL FLOOR PLAN', C_W - 690, C_H - 220);
    ctx.fillText('SCALE 1:50    UNITS: METERS', C_W - 690, C_H - 188);
    ctx.fillText('TOWER 12 · 12 LEVELS · 72 UNITS', C_W - 690, C_H - 156);
    ctx.font = 'bold 26px Heebo, sans-serif';
    ctx.fillStyle = 'rgba(253, 230, 138, 0.92)';
    ctx.fillText('הרצליה · 2026', C_W - 690, C_H - 116);

    ctx.lineCap = 'round';

    // === Building outer walls (drawn progressively) ===
    function drawOuter(p, t0, t1, color, w) {
      const k = clamp01((p - t0) / Math.max(0.001, t1 - t0));
      if (k <= 0) return;
      ctx.strokeStyle = color;
      ctx.lineWidth = w;
      // outer rectangle = building footprint
      const segs = [
        [[-W/2, -D/2], [ W/2, -D/2]],
        [[ W/2, -D/2], [ W/2,  D/2]],
        [[ W/2,  D/2], [-W/2,  D/2]],
        [[-W/2,  D/2], [-W/2, -D/2]],
      ];
      const segK = k * segs.length;
      for (let i = 0; i < segs.length; i++) {
        const seg = segs[i];
        const localK = clamp01(segK - i);
        if (localK <= 0) continue;
        const [a, b] = seg;
        ctx.beginPath();
        ctx.moveTo(wx(a[0]), wy(a[1]));
        ctx.lineTo(wx(a[0] + (b[0] - a[0]) * localK), wy(a[1] + (b[1] - a[1]) * localK));
        ctx.stroke();
      }
    }
    drawOuter(progress, 0.00, 0.18, '#7dd3fc', 16);

    // === Apartment partitions (drawn after outer walls) ===
    function drawPartitions(p, t0, t1) {
      const k = clamp01((p - t0) / Math.max(0.001, t1 - t0));
      if (k <= 0) return;
      ctx.strokeStyle = '#7dd3fc';
      ctx.lineWidth = 11;

      // Central corridor walls (along x-axis at z = -1 and z = 1)
      // Stairwell + elevator core in the middle
      const partitions = [
        // Corridor side walls
        [[-W/2, -1.5], [W/2, -1.5]],
        [[-W/2,  1.5], [W/2,  1.5]],
        // Vertical partitions between apartments (top side)
        [[-5, -D/2], [-5, -1.5]],
        [[ 5, -D/2], [ 5, -1.5]],
        // Vertical partitions between apartments (bottom side)
        [[-5,  1.5], [-5,  D/2]],
        [[ 5,  1.5], [ 5,  D/2]],
      ];
      const segK = k * partitions.length;
      for (let i = 0; i < partitions.length; i++) {
        const seg = partitions[i];
        const localK = clamp01(segK - i);
        if (localK <= 0) continue;
        const [a, b] = seg;
        ctx.beginPath();
        ctx.moveTo(wx(a[0]), wy(a[1]));
        ctx.lineTo(wx(a[0] + (b[0] - a[0]) * localK), wy(a[1] + (b[1] - a[1]) * localK));
        ctx.stroke();
      }
    }
    drawPartitions(progress, 0.18, 0.28);

    // === Apartment-internal walls (drawn after partitions) ===
    function drawInternalWalls(p, t0, t1) {
      const k = clamp01((p - t0) / Math.max(0.001, t1 - t0));
      if (k <= 0) return;
      ctx.strokeStyle = '#7dd3fc';
      ctx.lineWidth = 8;

      // Internal layout for each apartment
      // Apartments are at: top side X centers -10, 0, +10 (10m wide each)
      //                    bottom side X centers -10, 0, +10 (mirrored)
      // Each apartment is 10m wide, depth 6.5m (z -8 to -1.5 or 1.5 to 8)
      // Layout in each top apartment:
      //   - Living + Kitchen + Dining: front (z = -8 to -5), full width
      //   - Bedroom: back-left (z = -5 to -3, x = center-5 to center-1)
      //   - Bathroom: back-right (z = -5 to -3, x = center-1 to center+2)
      //   - Foyer / hallway: z = -3 to -1.5
      const localWalls = [
        // Wall between living and bedroom/bath
        [-5, -5,  5, -5],
        // Wall between bedroom and bathroom
        [-1, -5, -1, -3],
        // Wall between bath and second bedroom
        [ 2, -5,  2, -3],
        // Hallway walls
        [-5, -3,  -1, -3],
        [ 2, -3,  5, -3],
      ];
      const apartmentCenters = [-10, 0, 10];

      const allSegs = [];
      apartmentCenters.forEach(cx0 => {
        // Top apartments
        localWalls.forEach(([x1, z1, x2, z2]) => {
          allSegs.push([[cx0 + x1, z1], [cx0 + x2, z2]]);
        });
        // Bottom apartments (mirrored: z negated, walls in z=1.5..8 zone)
        localWalls.forEach(([x1, z1, x2, z2]) => {
          allSegs.push([[cx0 + x1, -z1], [cx0 + x2, -z2]]);
        });
      });
      const segK = k * allSegs.length;
      for (let i = 0; i < allSegs.length; i++) {
        const localK = clamp01(segK - i);
        if (localK <= 0) continue;
        const [a, b] = allSegs[i];
        ctx.beginPath();
        ctx.moveTo(wx(a[0]), wy(a[1]));
        ctx.lineTo(wx(a[0] + (b[0] - a[0]) * localK), wy(a[1] + (b[1] - a[1]) * localK));
        ctx.stroke();
      }
    }
    drawInternalWalls(progress, 0.28, 0.40);

    // === Furniture & symbols (appear after walls done) ===
    if (progress > 0.40) {
      const furnK = clamp01((progress - 0.40) / 0.18);
      ctx.globalAlpha = furnK;

      const apartmentCenters = [-10, 0, 10];

      // The plan plane is rendered at roughly 2.3x downscale at the cinematic
      // camera height, so every stroke gets an extra ~3x multiplier here so
      // the furniture symbols stay legible on screen.
      const LWX = 3.0;

      // Helpers: drawing furniture symbols in plan view
      function rectAt(cx0, cz, w, d, fillStyle, strokeStyle, lw) {
        ctx.beginPath();
        ctx.fillStyle = fillStyle;
        ctx.strokeStyle = strokeStyle;
        ctx.lineWidth = (lw || 1.4) * LWX;
        const x = wx(cx0 - w/2), y = wy(cz - d/2);
        ctx.fillRect(x, y, w * px, d * py);
        ctx.strokeRect(x, y, w * px, d * py);
      }
      function lineSeg(x1, z1, x2, z2, color, lw) {
        ctx.strokeStyle = color;
        ctx.lineWidth = (lw || 1.5) * LWX;
        ctx.beginPath();
        ctx.moveTo(wx(x1), wy(z1));
        ctx.lineTo(wx(x2), wy(z2));
        ctx.stroke();
      }
      function circleAt(cx0, cz, r, fill, stroke, lw) {
        ctx.beginPath();
        ctx.fillStyle = fill;
        ctx.strokeStyle = stroke;
        ctx.lineWidth = (lw || 1.2) * LWX;
        ctx.arc(wx(cx0), wy(cz), r * px, 0, Math.PI*2);
        if (fill) ctx.fill();
        if (stroke) ctx.stroke();
      }
      // Furniture symbols use a brighter fill against the dark blueprint
      // paper so the shapes read clearly even after the canvas is downscaled
      // when rendered to screen.
      const FILL_DARK  = '#1d4070';
      const FILL_MED   = '#2a5b95';
      const STROKE_HI  = '#bae6fd';
      const STROKE_MED = '#7dd3fc';
      const ACCENT     = '#fde68a';

      // Sofa (3-seater): cx,cz center; width along X, depth along Z; back at -Z
      function sofa(cx0, cz, rotated) {
        const w = rotated ? 0.95 : 2.4;
        const d = rotated ? 2.4 : 0.95;
        rectAt(cx0, cz, w, d, FILL_DARK, STROKE_HI, 2.0);
        if (!rotated) {
          for (let i = 1; i < 3; i++) {
            const x = cx0 - w/2 + (w * i) / 3;
            lineSeg(x, cz - d/2 + 0.05, x, cz + d/2 - 0.05, STROKE_MED, 1.4);
          }
        } else {
          for (let i = 1; i < 3; i++) {
            const z = cz - d/2 + (d * i) / 3;
            lineSeg(cx0 - w/2 + 0.05, z, cx0 + w/2 - 0.05, z, STROKE_MED, 1.4);
          }
        }
      }
      // Coffee table
      function coffeeTable(cx0, cz) {
        rectAt(cx0, cz, 1.0, 0.55, FILL_DARK, STROKE_HI, 1.8);
      }
      // TV unit
      function tvUnit(cx0, cz, vertical) {
        if (vertical) rectAt(cx0, cz, 0.4, 1.6, FILL_DARK, STROKE_HI, 1.8);
        else          rectAt(cx0, cz, 1.6, 0.4, FILL_DARK, STROKE_HI, 1.8);
      }
      // Dining table (oval) + chairs
      function diningSet(cx0, cz, rot) {
        ctx.fillStyle = FILL_DARK;
        ctx.strokeStyle = STROKE_HI;
        ctx.lineWidth = 2.0 * LWX;
        ctx.beginPath();
        ctx.ellipse(wx(cx0), wy(cz), (rot ? 0.7 : 1.1) * px, (rot ? 1.1 : 0.7) * py, 0, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
        const chairs = rot
          ? [[0, -1.4], [0, 1.4], [-1.0, -0.6], [-1.0, 0.6], [1.0, -0.6], [1.0, 0.6]]
          : [[-1.4, 0], [1.4, 0], [-0.6, -1.0], [0.6, -1.0], [-0.6, 1.0], [0.6, 1.0]];
        chairs.forEach(([dx, dz]) => {
          circleAt(cx0 + dx, cz + dz, 0.22, FILL_MED, STROKE_HI, 1.4);
        });
      }
      // Kitchen: counter + sink + stove + fridge
      function kitchen(cx0, cz, dir) {
        rectAt(cx0, cz, 3.5, 0.6, FILL_DARK, STROKE_HI, 1.8);
        // Sink
        rectAt(cx0 - 1.1, cz, 0.6, 0.45, FILL_MED, STROKE_HI, 1.4);
        circleAt(cx0 - 1.1, cz, 0.18, null, STROKE_MED, 1.4);
        // Stove (4 burners)
        rectAt(cx0, cz, 0.6, 0.55, FILL_MED, STROKE_HI, 1.4);
        const burners = [[-0.18, -0.13], [0.18, -0.13], [-0.18, 0.13], [0.18, 0.13]];
        burners.forEach(([dx, dz]) => {
          circleAt(cx0 + dx, cz + dz, 0.08, ACCENT, ACCENT, 1.0);
        });
        // Fridge
        rectAt(cx0 + 1.3, cz, 0.7, 0.65, FILL_MED, STROKE_HI, 1.6);
        // Fridge "F" label
        ctx.font = 'bold 26px "Space Mono", monospace';
        ctx.fillStyle = STROKE_HI;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('F', wx(cx0 + 1.3), wy(cz));
      }
      // Double bed
      function bedDouble(cx0, cz, rot) {
        const w = rot ? 1.5 : 1.7;
        const d = rot ? 1.7 : 1.5;
        rectAt(cx0, cz, w, d, FILL_DARK, STROKE_HI, 2.0);
        ctx.fillStyle = STROKE_MED;
        ctx.strokeStyle = STROKE_HI;
        ctx.lineWidth = 1.5 * LWX;
        if (rot) {
          ctx.fillRect(wx(cx0 - w/2 + 0.05), wy(cz - d/2 + 0.1), 0.35*px, (d - 0.2)*py * 0.4);
          ctx.fillRect(wx(cx0 - w/2 + 0.05), wy(cz + d/2 - 0.1 - (d - 0.2) * 0.4), 0.35*px, (d - 0.2)*py * 0.4);
        } else {
          ctx.fillRect(wx(cx0 - w/2 + 0.1), wy(cz - d/2 + 0.05), (w - 0.2)*px * 0.4, 0.35*py);
          ctx.fillRect(wx(cx0 + w/2 - 0.1 - (w - 0.2) * 0.4), wy(cz - d/2 + 0.05), (w - 0.2)*px * 0.4, 0.35*py);
        }
      }
      // Single bed
      function bedSingle(cx0, cz, rot) {
        const w = rot ? 0.9 : 1.9;
        const d = rot ? 1.9 : 0.9;
        rectAt(cx0, cz, w, d, FILL_DARK, STROKE_HI, 1.8);
        ctx.fillStyle = STROKE_MED;
        if (rot) ctx.fillRect(wx(cx0 - w/2 + 0.05), wy(cz - d/2 + 0.1), 0.25*px, 0.55*py);
        else     ctx.fillRect(wx(cx0 - w/2 + 0.1), wy(cz - d/2 + 0.05), 0.55*px, 0.25*py);
      }
      // Wardrobe (with X marking)
      function wardrobe(cx0, cz, w, d) {
        rectAt(cx0, cz, w, d, FILL_DARK, STROKE_HI, 1.8);
        ctx.strokeStyle = STROKE_MED;
        ctx.lineWidth = 1.2 * LWX;
        const x1 = wx(cx0 - w/2 + 0.05), y1 = wy(cz - d/2 + 0.05);
        const x2 = wx(cx0 + w/2 - 0.05), y2 = wy(cz + d/2 - 0.05);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x2, y1); ctx.lineTo(x1, y2); ctx.stroke();
      }
      // Toilet
      function toilet(cx0, cz, rot) {
        ctx.fillStyle = FILL_DARK;
        ctx.strokeStyle = STROKE_HI;
        ctx.lineWidth = 1.8 * LWX;
        ctx.save();
        ctx.translate(wx(cx0), wy(cz));
        if (rot) ctx.rotate(Math.PI/2);
        ctx.beginPath();
        ctx.ellipse(0, 0.05*py, 0.30*px, 0.40*py, 0, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
        ctx.fillRect(-0.36*px, -0.45*py, 0.72*px, 0.18*py);
        ctx.strokeRect(-0.36*px, -0.45*py, 0.72*px, 0.18*py);
        ctx.restore();
      }
      // Bath sink
      function bathSink(cx0, cz, rot) {
        rectAt(cx0, cz, rot ? 0.45 : 0.7, rot ? 0.7 : 0.45, FILL_MED, STROKE_HI, 1.6);
        circleAt(cx0, cz, 0.18, null, STROKE_MED, 1.4);
      }
      // Bathtub
      function bathtub(cx0, cz, rot) {
        const w = rot ? 0.75 : 1.7, d = rot ? 1.7 : 0.75;
        rectAt(cx0, cz, w, d, FILL_DARK, STROKE_HI, 1.8);
        ctx.strokeStyle = STROKE_MED;
        ctx.lineWidth = 1.4 * LWX;
        ctx.beginPath();
        ctx.ellipse(wx(cx0), wy(cz), (rot ? 0.30 : 0.75) * px, (rot ? 0.75 : 0.30) * py, 0, 0, Math.PI*2);
        ctx.stroke();
      }
      // Door arc + leaf
      function doorArc(hingeX, hingeZ, leafLen, startAngle, endAngle) {
        ctx.strokeStyle = ACCENT;
        ctx.lineWidth = 2.0 * LWX;
        ctx.beginPath();
        ctx.arc(wx(hingeX), wy(hingeZ), leafLen * px, startAngle, endAngle);
        ctx.stroke();
        ctx.lineWidth = 4.0 * LWX;
        ctx.beginPath();
        ctx.moveTo(wx(hingeX), wy(hingeZ));
        ctx.lineTo(wx(hingeX) + Math.cos(endAngle) * leafLen * px,
                   wy(hingeZ) + Math.sin(endAngle) * leafLen * py);
        ctx.stroke();
      }
      // Window symbol (triple line)
      function winSym(x1, z1, x2, z2) {
        const dx = x2 - x1, dz = z2 - z1;
        const len = Math.hypot(dx, dz);
        const nx = -dz / len, nz = dx / len;
        lineSeg(x1, z1, x2, z2, ACCENT, 3.5);
        const o = 0.10;
        lineSeg(x1 + nx*o, z1 + nz*o, x2 + nx*o, z2 + nz*o, ACCENT, 1.5);
        lineSeg(x1 - nx*o, z1 - nz*o, x2 - nx*o, z2 - nz*o, ACCENT, 1.5);
      }
      // Plant
      function plant(cx0, cz) {
        circleAt(cx0, cz, 0.30, FILL_MED, STROKE_MED, 1.6);
        ctx.font = 'bold 32px "Heebo", sans-serif';
        ctx.fillStyle = STROKE_MED;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✿', wx(cx0), wy(cz));
      }

      // For each top apartment (apartments at z=-8 to z=-1.5):
      // Living/Kitchen/Dining: z=-8 to -5, full width 10m, centered at cx0
      // Bedroom (master): z=-5 to -3, x = cx0-5..cx0-1 (4m wide, 2m deep)
      // Bathroom: z=-5 to -3, x = cx0-1..cx0+2 (3m wide, 2m deep)
      // Bedroom 2 (small): z=-5 to -3, x = cx0+2..cx0+5 (3m wide, 2m deep)
      // Hallway: z=-3 to -1.5, central
      function topApartment(cx0, mirror) {
        const m = mirror ? -1 : 1;
        // Living: sofa against rear wall (z=-8), facing in
        sofa(cx0 - 1.6, -7.4 * m, false);
        coffeeTable(cx0 - 1.6, -6.5 * m);
        tvUnit(cx0 - 1.6, -5.3 * m, false);
        // Dining + kitchen
        diningSet(cx0 + 2.8, -7 * m, false);
        // Kitchen counter near interior wall
        kitchen(cx0 + 2.5, -5.4 * m, 'in');
        // Master bedroom (cx0-3, z=-4 m)
        bedDouble(cx0 - 3, -4 * m, false);
        wardrobe(cx0 - 4.6, -3.4 * m, 0.6, 1.0);
        // Bathroom (cx0+0.5, z=-4 m)
        toilet(cx0 + 1.6, -3.4 * m, false);
        bathSink(cx0 + 0.0, -3.4 * m, false);
        bathtub(cx0 + 1.0, -4.5 * m, false);
        // Second bedroom
        bedSingle(cx0 + 3.5, -4 * m, false);
        wardrobe(cx0 + 4.6, -3.3 * m, 0.6, 0.8);
        // Doors:
        // Apartment entry from corridor (z=-1.5 to z=-3 hallway opens)
        doorArc(cx0, -1.5 * m, 0.9, mirror ? Math.PI/2 : -Math.PI/2, mirror ? Math.PI : 0);
        // Master bedroom door
        doorArc(cx0 - 1.0, -3 * m, 0.8, mirror ? Math.PI : 0, mirror ? Math.PI*1.5 : Math.PI/2);
        // Bathroom door
        doorArc(cx0 + 1.5, -3 * m, 0.7, mirror ? Math.PI : 0, mirror ? Math.PI*1.5 : Math.PI/2);
        // Second bedroom door
        doorArc(cx0 + 3.5, -3 * m, 0.7, mirror ? Math.PI : 0, mirror ? Math.PI*1.5 : Math.PI/2);
        // Living window (front, z=-D/2)
        winSym(cx0 - 4, -D/2, cx0 - 1, -D/2);
        winSym(cx0 + 1, -D/2, cx0 + 4, -D/2);
        // Side windows on outermost apartments
        if (cx0 === -10) {
          winSym(-W/2, -7, -W/2, -5);
          winSym(-W/2, -4, -W/2, -2);
        } else if (cx0 === 10) {
          winSym(W/2, -7, W/2, -5);
          winSym(W/2, -4, W/2, -2);
        }
        // Plant near entry
        plant(cx0 - 4.4, -1.8 * m);
      }

      apartmentCenters.forEach(c => topApartment(c, false));   // top side
      apartmentCenters.forEach(c => topApartment(c, true));    // bottom side (mirrored)

      // Central core: stairs + elevator + corridor labels
      // Stairs: parallel lines with arrow
      ctx.strokeStyle = '#fde68a';
      ctx.lineWidth = 1.4;
      const stairX = -W/2 + 1.5;
      for (let i = 0; i < 8; i++) {
        const sz = -1.0 + i * 0.25;
        lineSeg(stairX, sz, stairX + 1.6, sz, '#fde68a', 1.0);
      }
      // Stairs frame
      ctx.lineWidth = 2;
      lineSeg(stairX, -1.2, stairX + 1.6, -1.2, '#fde68a', 2);
      lineSeg(stairX, 1.2, stairX + 1.6, 1.2, '#fde68a', 2);
      lineSeg(stairX, -1.2, stairX, 1.2, '#fde68a', 2);
      lineSeg(stairX + 1.6, -1.2, stairX + 1.6, 1.2, '#fde68a', 2);
      // Stairs label
      ctx.font = 'bold 30px Heebo';
      ctx.fillStyle = '#fde68a';
      ctx.textAlign = 'center';
      ctx.fillText('מדרגות', wx(stairX + 0.8), wy(-1.4));
      // Elevator (square with X)
      const elevX = -W/2 + 4;
      rectAt(elevX, 0, 1.5, 1.5, FILL_DARK, '#fde68a', 3.0);
      lineSeg(elevX - 0.7, -0.7, elevX + 0.7, 0.7, '#fde68a', 2.0);
      lineSeg(elevX + 0.7, -0.7, elevX - 0.7, 0.7, '#fde68a', 2.0);
      ctx.fillStyle = '#fde68a';
      ctx.fillText('מעלית', wx(elevX), wy(-1.0));

      // Corridor label
      ctx.font = 'bold 32px Heebo';
      ctx.fillStyle = 'rgba(186, 230, 253, 0.95)';
      ctx.fillText('פרוזדור', wx(W/2 - 4), wy(-0.05));

      ctx.globalAlpha = 1;
    }

    // === Room labels (with apartment IDs) ===
    if (progress > 0.50) {
      const labK = clamp01((progress - 0.50) / 0.15);
      ctx.globalAlpha = labK;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const apartmentCenters = [-10, 0, 10];
      apartmentCenters.forEach((c, i) => {
        // top side
        ctx.font = 'bold 38px "Space Mono", monospace';
        ctx.fillStyle = 'rgba(253, 230, 138, 0.95)';
        ctx.fillText(`UNIT 0${i*2 + 1}`, wx(c), wy(-0.7));
        ctx.font = 'bold 44px Heebo';
        ctx.fillStyle = 'rgba(186, 230, 253, 1.0)';
        ctx.fillText('סלון · מטבח', wx(c - 1.3), wy(-6.4));
        ctx.font = 'bold 32px Heebo';
        ctx.fillText('חדר שינה', wx(c - 3), wy(-4));
        ctx.fillText('מקלחת', wx(c + 1), wy(-3.7));
        ctx.fillText('חדר 2', wx(c + 3.6), wy(-4));

        ctx.font = 'bold 38px "Space Mono", monospace';
        ctx.fillStyle = 'rgba(253, 230, 138, 0.95)';
        ctx.fillText(`UNIT 0${i*2 + 2}`, wx(c), wy(0.7));
        ctx.font = 'bold 44px Heebo';
        ctx.fillStyle = 'rgba(186, 230, 253, 1.0)';
        ctx.fillText('סלון · מטבח', wx(c - 1.3), wy(6.4));
        ctx.font = 'bold 32px Heebo';
        ctx.fillText('חדר שינה', wx(c - 3), wy(4));
        ctx.fillText('מקלחת', wx(c + 1), wy(3.7));
        ctx.fillText('חדר 2', wx(c + 3.6), wy(4));
      });
      ctx.globalAlpha = 1;
    }

    // === Dimensions ===
    if (progress > 0.65) {
      const dimK = clamp01((progress - 0.65) / 0.15);
      ctx.globalAlpha = dimK;
      ctx.strokeStyle = 'rgba(189, 230, 253, 0.7)';
      ctx.fillStyle = 'rgba(253, 230, 138, 0.95)';
      ctx.lineWidth = 1.2;
      ctx.font = '600 30px "Space Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // Top dim line
      const dimY1 = wy(-D/2 - 1.4);
      const dimY2 = wy(-D/2 - 1.0);
      ctx.beginPath();
      ctx.moveTo(wx(-W/2), dimY1); ctx.lineTo(wx(W/2), dimY1);
      ctx.moveTo(wx(-W/2), dimY1 - 12); ctx.lineTo(wx(-W/2), dimY1 + 12);
      ctx.moveTo(wx(W/2), dimY1 - 12); ctx.lineTo(wx(W/2), dimY1 + 12);
      ctx.stroke();
      ctx.fillText('30.00 מ', wx(0), dimY1 - 22);
      // Side dim
      const dimX1 = wx(-W/2 - 1.4);
      ctx.beginPath();
      ctx.moveTo(dimX1, wy(-D/2)); ctx.lineTo(dimX1, wy(D/2));
      ctx.moveTo(dimX1 - 12, wy(-D/2)); ctx.lineTo(dimX1 + 12, wy(-D/2));
      ctx.moveTo(dimX1 - 12, wy(D/2)); ctx.lineTo(dimX1 + 12, wy(D/2));
      ctx.stroke();
      ctx.save();
      ctx.translate(dimX1 - 28, wy(0));
      ctx.rotate(-Math.PI/2);
      ctx.fillText('16.00 מ', 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // === North arrow ===
    if (progress > 0.78) {
      const op = clamp01((progress - 0.78) / 0.12);
      ctx.globalAlpha = op;
      ctx.strokeStyle = 'rgba(253, 230, 138, 0.85)';
      ctx.fillStyle = 'rgba(253, 230, 138, 0.85)';
      ctx.lineWidth = 2;
      const ax = wx(W/2 + 4);
      const ay = wy(0);
      ctx.beginPath();
      ctx.arc(ax, ay, 50, 0, Math.PI*2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ax, ay - 42);
      ctx.lineTo(ax - 14, ay + 16);
      ctx.lineTo(ax, ay);
      ctx.lineTo(ax + 14, ay + 16);
      ctx.closePath();
      ctx.fill();
      ctx.font = 'bold 28px "Space Mono", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('N', ax, ay - 70);
      ctx.globalAlpha = 1;
    }

    return canvas;

    function clamp01(v) { return Math.max(0, Math.min(1, v)); }
  }

  const planCanvasEl = makePlanCanvas(1);
  const planTex = new THREE.CanvasTexture(planCanvasEl);
  planTex.colorSpace = THREE.SRGBColorSpace;
  planTex.minFilter = THREE.LinearFilter;
  planTex.magFilter = THREE.LinearFilter;
  planTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const planMat = new THREE.MeshBasicMaterial({
    map: planTex, transparent: true, opacity: 1,
    depthWrite: false, side: THREE.DoubleSide,
  });
  const planMesh = new THREE.Mesh(new THREE.PlaneGeometry(PLAN_W, PLAN_D), planMat);
  planMesh.rotation.x = -Math.PI / 2;
  planMesh.position.y = 0.03;
  scene.add(planMesh);

  let lastPlanProgress = -1;
  function updatePlanProgress(p) {
    if (Math.abs(p - lastPlanProgress) < 0.005) return;
    lastPlanProgress = p;
    const c = makePlanCanvas(p);
    planTex.image = c;
    planTex.needsUpdate = true;
  }

  // ============================================================
  // BUILDING (12-floor tower)
  // ============================================================
  // Clipping plane for floor-by-floor reveal.
  // THREE.Plane.distanceToPoint = dot(N, P) + constant.
  // A point is rendered when distance > 0, so with N=(0,-1,0):
  //   -y + constant > 0  →  y < constant.
  // Setting constant = buildHeight reveals everything below the rising plane.
  const clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
  clipPlane.constant = 0; // initial: y < 0 visible → nothing above ground.

  const buildingGroup = new THREE.Group();
  scene.add(buildingGroup);
  const buildingMaterials = [];
  function applyClipping(mat) {
    mat.clippingPlanes = [clipPlane];
    mat.clipShadows = true;
    buildingMaterials.push(mat);
  }

  // Foundation
  const foundationMat = new THREE.MeshStandardMaterial({
    color: 0x33363d, roughness: 0.9,
  });
  const foundation = new THREE.Mesh(
    new THREE.BoxGeometry(W + 2.0, 0.6, D + 2.0),
    foundationMat
  );
  foundation.position.y = 0.3;
  foundation.castShadow = true;
  foundation.receiveShadow = true;
  buildingGroup.add(foundation);

  // === Outer walls (full-tall single mesh, clipped by plane) ===
  const wallMatA = new THREE.MeshStandardMaterial({
    color: 0xc9c0b4, roughness: 0.85, metalness: 0.02,
  });
  const wallMatB = new THREE.MeshStandardMaterial({
    color: 0xb6ad9f, roughness: 0.88, metalness: 0.02,
  });
  applyClipping(wallMatA);
  applyClipping(wallMatB);

  const wallT = 0.35;
  function makeOuterWall(w, h, d, x, y, z, mat) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z);
    m.castShadow = true;
    m.receiveShadow = true;
    buildingGroup.add(m);
    return m;
  }
  // Walls span 0.6 (top of foundation) to TOTAL_H + 0.6
  const wallY = 0.6 + TOTAL_H / 2;
  makeOuterWall(W + wallT, TOTAL_H, wallT,    0,   wallY, -D/2, wallMatA); // front
  makeOuterWall(W + wallT, TOTAL_H, wallT,    0,   wallY,  D/2, wallMatB); // back
  makeOuterWall(wallT, TOTAL_H, D + wallT, -W/2, wallY,    0, wallMatA); // left
  makeOuterWall(wallT, TOTAL_H, D + wallT,  W/2, wallY,    0, wallMatA); // right

  // === Floor slabs + cornices ===
  const slabMat = new THREE.MeshStandardMaterial({
    color: 0x6e6358, roughness: 0.85,
  });
  applyClipping(slabMat);
  const corniceMat = new THREE.MeshStandardMaterial({
    color: 0xe8e0d3, roughness: 0.7,
  });
  applyClipping(corniceMat);

  for (let f = 1; f <= FLOORS; f++) {
    const y = 0.6 + f * FLOOR_H;
    // Floor slab (visible only on the inside through windows; mostly aesthetic)
    // Actually we keep the cornice as a thin band on the outside for floor delineation
    const cornice = new THREE.Mesh(
      new THREE.BoxGeometry(W + wallT + 0.2, 0.18, D + wallT + 0.2),
      corniceMat
    );
    cornice.position.set(0, y - 0.09, 0);
    cornice.castShadow = true;
    cornice.receiveShadow = true;
    buildingGroup.add(cornice);
  }

  // === Windows (InstancedMesh — frame and glass) ===
  // Window grid:
  // Front/back: 8 columns per floor (every 3.5m roughly)
  // Sides: 4 columns
  // 12 floors → total = (8 + 8 + 4 + 4) * 12 = 288 windows

  const winW = 1.6, winH = 1.6;
  const sillH = 1.0;            // height from floor to bottom of window

  // Frame geometry: a thin "picture frame" — a flat box with a slightly
  // smaller emissive glass inside. We'll use two instanced meshes.
  const frameOuterGeom = new THREE.BoxGeometry(winW + 0.2, winH + 0.2, 0.08);
  const frameMat = new THREE.MeshStandardMaterial({
    color: 0x1c1f23, roughness: 0.6, metalness: 0.4,
  });
  applyClipping(frameMat);

  const glassGeom = new THREE.BoxGeometry(winW, winH, 0.04);
  const glassMat = new THREE.MeshStandardMaterial({
    color: 0x223040, emissive: 0xffd680, emissiveIntensity: 0,
    roughness: 0.18, metalness: 0.55,
  });
  applyClipping(glassMat);

  // Window cross (mullions): horizontal + vertical thin boxes per window
  // Use one instanced mesh: 2 mullions per window. To keep things simpler,
  // we'll add mullions as separate instanced meshes.
  const mullionVertGeom = new THREE.BoxGeometry(0.05, winH, 0.05);
  const mullionHorzGeom = new THREE.BoxGeometry(winW, 0.05, 0.05);
  const mullionMat = new THREE.MeshStandardMaterial({
    color: 0x2a2d33, roughness: 0.6, metalness: 0.3,
  });
  applyClipping(mullionMat);

  const sillGeom = new THREE.BoxGeometry(winW + 0.4, 0.08, 0.18);
  const sillMat = new THREE.MeshStandardMaterial({
    color: 0xc8c0b3, roughness: 0.7,
  });
  applyClipping(sillMat);

  // Compute window positions
  const windowSpecs = [];
  for (let f = 0; f < FLOORS; f++) {
    const baseY = 0.6 + f * FLOOR_H + sillH + winH / 2;
    // Front (z = -D/2)
    for (let c = 0; c < 8; c++) {
      const x = -W/2 + (c + 0.5) * (W / 8);
      windowSpecs.push({ x, y: baseY, z: -D/2 - wallT/2 - 0.05, rotY: 0 });
    }
    // Back (z = +D/2)
    for (let c = 0; c < 8; c++) {
      const x = -W/2 + (c + 0.5) * (W / 8);
      windowSpecs.push({ x, y: baseY, z:  D/2 + wallT/2 + 0.05, rotY: Math.PI });
    }
    // Left (x = -W/2)
    for (let c = 0; c < 4; c++) {
      const z = -D/2 + (c + 0.5) * (D / 4);
      windowSpecs.push({ x: -W/2 - wallT/2 - 0.05, y: baseY, z, rotY: -Math.PI/2 });
    }
    // Right
    for (let c = 0; c < 4; c++) {
      const z = -D/2 + (c + 0.5) * (D / 4);
      windowSpecs.push({ x:  W/2 + wallT/2 + 0.05, y: baseY, z, rotY:  Math.PI/2 });
    }
  }
  const N_WINDOWS = windowSpecs.length;

  function makeInstanced(geom, mat, count) {
    const m = new THREE.InstancedMesh(geom, mat, count);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  const framesInst   = makeInstanced(frameOuterGeom, frameMat, N_WINDOWS);
  const glassInst    = makeInstanced(glassGeom, glassMat, N_WINDOWS);
  const mullionsVert = makeInstanced(mullionVertGeom, mullionMat, N_WINDOWS);
  const mullionsHorz = makeInstanced(mullionHorzGeom, mullionMat, N_WINDOWS);
  const sillsInst    = makeInstanced(sillGeom, sillMat, N_WINDOWS);

  const m4 = new THREE.Matrix4();
  const eu = new THREE.Euler();
  const v3 = new THREE.Vector3();
  const q4 = new THREE.Quaternion();
  const sc = new THREE.Vector3(1, 1, 1);
  const v3sill = new THREE.Vector3();
  for (let i = 0; i < N_WINDOWS; i++) {
    const s = windowSpecs[i];
    eu.set(0, s.rotY, 0);
    q4.setFromEuler(eu);
    v3.set(s.x, s.y, s.z);
    m4.compose(v3, q4, sc);
    framesInst.setMatrixAt(i, m4);
    glassInst.setMatrixAt(i, m4);
    mullionsVert.setMatrixAt(i, m4);
    mullionsHorz.setMatrixAt(i, m4);
    // Sill is just below
    v3sill.set(s.x, s.y - winH/2 - 0.08, s.z);
    m4.compose(v3sill, q4, sc);
    sillsInst.setMatrixAt(i, m4);
  }
  framesInst.instanceMatrix.needsUpdate = true;
  glassInst.instanceMatrix.needsUpdate = true;
  mullionsVert.instanceMatrix.needsUpdate = true;
  mullionsHorz.instanceMatrix.needsUpdate = true;
  sillsInst.instanceMatrix.needsUpdate = true;
  buildingGroup.add(framesInst);
  buildingGroup.add(glassInst);
  buildingGroup.add(mullionsVert);
  buildingGroup.add(mullionsHorz);
  buildingGroup.add(sillsInst);

  // Ground-floor lobby entrance (double-height glass)
  const lobbyMat = new THREE.MeshStandardMaterial({
    color: 0x1a2535, emissive: 0xffe7b0, emissiveIntensity: 0.0,
    roughness: 0.15, metalness: 0.6,
  });
  applyClipping(lobbyMat);
  const lobbyW = 6, lobbyH = FLOOR_H * 1.6;
  const lobby = new THREE.Mesh(
    new THREE.BoxGeometry(lobbyW, lobbyH, 0.2),
    lobbyMat
  );
  lobby.position.set(0, 0.6 + lobbyH/2, -D/2 - wallT/2 - 0.06);
  lobby.castShadow = true;
  buildingGroup.add(lobby);
  // Lobby frame
  const lobbyFrameMat = new THREE.MeshStandardMaterial({
    color: 0x1a1c20, roughness: 0.4, metalness: 0.7,
  });
  applyClipping(lobbyFrameMat);
  // top + bottom + sides + 2 mullions
  function lobbyBar(w, h, d, x, y, z) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), lobbyFrameMat);
    m.position.set(x, y, z);
    m.castShadow = true;
    buildingGroup.add(m);
  }
  lobbyBar(lobbyW + 0.2, 0.18, 0.25, 0, 0.6 + lobbyH + 0.09, -D/2 - wallT/2 - 0.05);
  lobbyBar(lobbyW + 0.2, 0.18, 0.25, 0, 0.6 + 0.09, -D/2 - wallT/2 - 0.05);
  lobbyBar(0.18, lobbyH + 0.18, 0.25, -lobbyW/2 - 0.09, 0.6 + lobbyH/2, -D/2 - wallT/2 - 0.05);
  lobbyBar(0.18, lobbyH + 0.18, 0.25,  lobbyW/2 + 0.09, 0.6 + lobbyH/2, -D/2 - wallT/2 - 0.05);
  lobbyBar(0.10, lobbyH, 0.20, -lobbyW/4, 0.6 + lobbyH/2, -D/2 - wallT/2 - 0.04);
  lobbyBar(0.10, lobbyH, 0.20,  lobbyW/4, 0.6 + lobbyH/2, -D/2 - wallT/2 - 0.04);
  // Canopy
  const canopyMat = new THREE.MeshStandardMaterial({
    color: 0x1a1c20, roughness: 0.4, metalness: 0.7,
  });
  applyClipping(canopyMat);
  const canopy = new THREE.Mesh(new THREE.BoxGeometry(lobbyW + 1.5, 0.2, 1.6), canopyMat);
  canopy.position.set(0, 0.6 + lobbyH + 0.4, -D/2 - 0.5);
  canopy.castShadow = true;
  buildingGroup.add(canopy);

  // === Roof (flat with parapet, mechanical, antenna) ===
  const roofGroup = new THREE.Group();
  buildingGroup.add(roofGroup);
  const roofY = 0.6 + TOTAL_H;
  // Roof slab
  const roofSlab = new THREE.Mesh(
    new THREE.BoxGeometry(W + wallT, 0.4, D + wallT),
    new THREE.MeshStandardMaterial({ color: 0x52524d, roughness: 0.85 })
  );
  roofSlab.position.set(0, roofY + 0.2, 0);
  roofSlab.castShadow = true; roofSlab.receiveShadow = true;
  applyClipping(roofSlab.material);
  roofGroup.add(roofSlab);
  // Parapet
  const parapetMat = new THREE.MeshStandardMaterial({ color: 0xc9c0b4, roughness: 0.85 });
  applyClipping(parapetMat);
  const parH = 1.1;
  function parapetSeg(w, d, x, z) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, parH, d), parapetMat);
    m.position.set(x, roofY + 0.4 + parH/2, z);
    m.castShadow = true; m.receiveShadow = true;
    roofGroup.add(m);
  }
  parapetSeg(W + wallT, 0.3, 0, -D/2);
  parapetSeg(W + wallT, 0.3, 0,  D/2);
  parapetSeg(0.3, D + wallT, -W/2, 0);
  parapetSeg(0.3, D + wallT,  W/2, 0);

  // HVAC unit
  const hvacMat = new THREE.MeshStandardMaterial({ color: 0xb6b0a8, roughness: 0.7, metalness: 0.3 });
  applyClipping(hvacMat);
  const hvac = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.2, 2.0), hvacMat);
  hvac.position.set(-W/2 + 5, roofY + 0.4 + 0.6, 2);
  hvac.castShadow = true; hvac.receiveShadow = true;
  roofGroup.add(hvac);
  // Vents on top of HVAC
  const ventMat = new THREE.MeshStandardMaterial({ color: 0x44443d, roughness: 0.6 });
  applyClipping(ventMat);
  for (let i = 0; i < 3; i++) {
    const v = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.4, 16), ventMat);
    v.position.set(-W/2 + 4 + i * 1.0, roofY + 0.4 + 1.4, 2);
    v.castShadow = true;
    roofGroup.add(v);
  }
  // Water tank
  const tank = new THREE.Mesh(
    new THREE.CylinderGeometry(1.4, 1.4, 2.4, 24),
    new THREE.MeshStandardMaterial({ color: 0x4f5a64, roughness: 0.5, metalness: 0.5 })
  );
  applyClipping(tank.material);
  tank.position.set(W/2 - 5, roofY + 0.4 + 1.2, -2.5);
  tank.castShadow = true;
  roofGroup.add(tank);
  // Antenna
  const antMat = new THREE.MeshStandardMaterial({ color: 0xc8c8c8, roughness: 0.4, metalness: 0.5 });
  applyClipping(antMat);
  const antennaPole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 5.2, 8), antMat);
  antennaPole.position.set(W/2 - 8, roofY + 0.4 + 2.6, 3);
  antennaPole.castShadow = true;
  roofGroup.add(antennaPole);
  for (let i = 0; i < 3; i++) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.5, 1.0), antMat);
    arm.position.set(W/2 - 8, roofY + 0.4 + 1.0 + i * 1.4, 3);
    arm.castShadow = true;
    roofGroup.add(arm);
  }
  // Stair box
  const stairBox = new THREE.Mesh(
    new THREE.BoxGeometry(3, 2.6, 3),
    new THREE.MeshStandardMaterial({ color: 0xc9c0b4, roughness: 0.85 })
  );
  applyClipping(stairBox.material);
  stairBox.position.set(-W/2 + 4, roofY + 0.4 + 1.3, -2);
  stairBox.castShadow = true; stairBox.receiveShadow = true;
  roofGroup.add(stairBox);

  // ============================================================
  // Surroundings: trees, lampposts, low-rise neighbors
  // ============================================================
  function makeTree(x, z, scale = 1) {
    const tree = new THREE.Group();
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.22, 1.4, 8),
      new THREE.MeshStandardMaterial({ color: 0x4a2e1a, roughness: 0.95 })
    );
    trunk.position.y = 0.7;
    trunk.castShadow = true;
    tree.add(trunk);
    const leaves = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.2, 0),
      new THREE.MeshStandardMaterial({ color: 0x2c5a2c, roughness: 0.95, flatShading: true })
    );
    leaves.position.y = 2.2;
    leaves.castShadow = true;
    tree.add(leaves);
    tree.position.set(x, 0, z);
    tree.scale.setScalar(scale);
    return tree;
  }
  const treePositions = [
    [-W/2 - 7, -D/2 - 7, 1.2],
    [-W/2 - 9,  D/2 + 3, 0.95],
    [-W/2 - 5,  D/2 + 7, 1.05],
    [ W/2 + 6, -D/2 - 8, 1.15],
    [ W/2 + 9, -D/2 + 2, 0.9],
    [ W/2 + 7,  D/2 + 5, 1.1],
    [ 0, -D/2 - 8, 1.0],
    [-12, D/2 + 9, 1.05],
  ];
  treePositions.forEach(([x, z, s]) => scene.add(makeTree(x, z, s)));

  function makeLamppost(x, z) {
    const g = new THREE.Group();
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.07, 0.09, 4.5, 8),
      new THREE.MeshStandardMaterial({ color: 0x33363a, roughness: 0.6, metalness: 0.5 })
    );
    pole.position.y = 2.25;
    pole.castShadow = true;
    g.add(pole);
    // Lamp head
    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 12, 12),
      new THREE.MeshStandardMaterial({
        color: 0xffd680, emissive: 0xffd680, emissiveIntensity: 0,
        roughness: 0.4,
      })
    );
    head.position.set(0, 4.6, 0);
    head.userData.isLamp = true;
    g.add(head);
    // Point light
    const pt = new THREE.PointLight(0xffd680, 0, 12, 1.5);
    pt.position.set(0, 4.5, 0);
    head.userData.light = pt;
    g.add(pt);
    g.position.set(x, 0, z);
    return g;
  }
  const lamps = [];
  [
    [-W/2 - 4, -D/2 - 4],
    [ W/2 + 4, -D/2 - 4],
    [-W/2 - 4,  D/2 + 4],
    [ W/2 + 4,  D/2 + 4],
    [ 0, -D/2 - 6],
    [ 0,  D/2 + 6],
  ].forEach(([x, z]) => {
    const lp = makeLamppost(x, z);
    scene.add(lp);
    lamps.push(lp);
  });

  // Surrounding low-rise neighbor buildings (depth context)
  function makeNeighbor(x, z, w, h, d, color) {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshStandardMaterial({ color, roughness: 0.85 })
    );
    m.position.set(x, h/2, z);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  scene.add(makeNeighbor(-50,  -30, 30, 14, 16, 0x9a8c7a));
  scene.add(makeNeighbor( 50,  -32, 25, 18, 14, 0xa0928e));
  scene.add(makeNeighbor( 55,   30, 20, 12, 22, 0x7c8a96));
  scene.add(makeNeighbor(-55,   34, 28, 16, 18, 0x9e9a8a));
  scene.add(makeNeighbor(-15,  -40, 18, 10, 14, 0x8e7c6a));
  scene.add(makeNeighbor( 22,   45, 20, 22, 16, 0xb0a698));

  // ============================================================
  // Construction "scan line" effect (a glowing horizontal plane
  // that follows the clip plane during build phase)
  // ============================================================
  const scanGeom = new THREE.PlaneGeometry(W + 4, D + 4);
  const scanMat = new THREE.MeshBasicMaterial({
    color: 0x7dd3fc, transparent: true, opacity: 0.0, depthWrite: false,
  });
  const scanLine = new THREE.Mesh(scanGeom, scanMat);
  scanLine.rotation.x = -Math.PI / 2;
  scene.add(scanLine);

  // ============================================================
  // Post-processing
  // ============================================================
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.85, 0.5, 0.62
  );
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  // ============================================================
  // Resize
  // ============================================================
  window.addEventListener('resize', () => {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    composer.setSize(w, h);
    bloom.resolution.set(w, h);
  });

  // ============================================================
  // Animation timeline
  // ============================================================
  function easeInOut(x) { return x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2) / 2; }
  function easeOut(x) { return 1 - (1 - x) * (1 - x); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function lerpColor(out, a, b, t) {
    out.r = a.r + (b.r - a.r) * t;
    out.g = a.g + (b.g - a.g) * t;
    out.b = a.b + (b.b - a.b) * t;
  }

  // Sky presets
  const skyDay      = { top: new THREE.Color(0x4d80c8), mid: new THREE.Color(0x8cb6e0), bot: new THREE.Color(0xc8d8e8) };
  const skyDawn     = { top: new THREE.Color(0x2c3a78), mid: new THREE.Color(0x8e7e9c), bot: new THREE.Color(0xd6a070) };
  const skyDusk     = { top: new THREE.Color(0x2c3a78), mid: new THREE.Color(0xb86a48), bot: new THREE.Color(0xe89858) };
  const skyNight    = { top: new THREE.Color(0x040816), mid: new THREE.Color(0x0a1430), bot: new THREE.Color(0x1a2444) };
  const skyBlueprint= { top: new THREE.Color(0x040816), mid: new THREE.Color(0x081428), bot: new THREE.Color(0x102040) };

  const tmpA = new THREE.Color();
  const tmpB = new THREE.Color();
  const tmpC = new THREE.Color();

  let startTime = null;

  function tick(now) {
    if (startTime === null) startTime = now;
    const t = ((now - startTime) % LOOP_MS) / LOOP_MS;

    let camMode;
    let blueprintAlpha = 0, planProgress = 1;
    let buildHeight = 0;       // current y of clip plane (0..TOTAL_H)
    let scanAlpha = 0, scanY = 0;
    let windowEmiss = 0;
    let lampInt = 0;
    let lobbyEmiss = 0;
    let sunDir = { az: -Math.PI/4, el: 0.10 };
    let sunIntensity = 0.05, hemiInt = 0.45, moonInt = 0.5;
    let starsAlpha = 0.7, fogD = 0.012, exposure = 0.95;
    let skyTop, skyMid, skyBot;

    // Phases (24s loop):
    // A: 0.00 - 0.32  Plan + furniture draws (top-down, close)
    // B: 0.32 - 0.42  Tilt down; blueprint fades; first floors extrude
    // C: 0.42 - 0.62  Floors rise (clip plane), camera orbits up
    // D: 0.62 - 0.72  Day orbit (close to facade)
    // E: 0.72 - 0.82  Sunset orbit
    // F: 0.82 - 0.93  Night, camera close to front showing lobby + lit windows
    // G: 0.93 - 0.99  Reverse → back to top-down plan
    // H: 0.99 - 1.00  Hold plan

    if (t < 0.32) {
      const k = t / 0.32;
      camMode = { type: 'plan', k };
      blueprintAlpha = clamp01(t * 25);
      planProgress = clamp01(k * 1.05);
      buildHeight = 0;
      scanAlpha = 0;
      sunIntensity = 0.05; hemiInt = 0.45; moonInt = 0.5;
      sunDir = { az: -Math.PI/4, el: 0.10 };
      skyTop = skyBlueprint.top; skyMid = skyBlueprint.mid; skyBot = skyBlueprint.bot;
      starsAlpha = 0.7; fogD = 0.010; exposure = 0.95;
      windowEmiss = 0; lampInt = 0;
    } else if (t < 0.42) {
      const k = (t - 0.32) / 0.10;
      const ek = easeInOut(k);
      camMode = { type: 'tiltIn', k: ek };
      blueprintAlpha = lerp(1, 0.0, ek);
      planProgress = 1;
      buildHeight = lerp(0, FLOOR_H * 1.5, ek);
      scanAlpha = lerp(0, 0.6, ek);
      scanY = buildHeight;
      sunIntensity = lerp(0.05, 0.6, ek);
      hemiInt = lerp(0.45, 0.55, ek);
      moonInt = lerp(0.5, 0.2, ek);
      sunDir = { az: -Math.PI/3, el: lerp(0.10, 0.22, ek) };
      lerpColor(tmpA, skyBlueprint.top, skyDawn.top, ek);
      lerpColor(tmpB, skyBlueprint.mid, skyDawn.mid, ek);
      lerpColor(tmpC, skyBlueprint.bot, skyDawn.bot, ek);
      skyTop = tmpA; skyMid = tmpB; skyBot = tmpC;
      starsAlpha = lerp(0.7, 0.2, ek);
      fogD = lerp(0.010, 0.006, ek);
      exposure = lerp(0.95, 1.05, ek);
      windowEmiss = 0; lampInt = 0;
    } else if (t < 0.62) {
      const k = (t - 0.42) / 0.20;
      const ek = easeOut(k);
      camMode = { type: 'orbitRise', k };
      blueprintAlpha = 0;
      buildHeight = lerp(FLOOR_H * 1.5, TOTAL_H + 4, ek);
      scanAlpha = lerp(0.6, 0.1, ek);
      scanY = Math.min(buildHeight, TOTAL_H + 0.5);
      sunIntensity = lerp(0.6, 2.2, ek);
      hemiInt = lerp(0.55, 0.7, ek);
      moonInt = lerp(0.2, 0.0, ek);
      sunDir = { az: lerp(-Math.PI/3, -Math.PI/4, k), el: lerp(0.22, 0.5, ek) };
      lerpColor(tmpA, skyDawn.top, skyDay.top, ek);
      lerpColor(tmpB, skyDawn.mid, skyDay.mid, ek);
      lerpColor(tmpC, skyDawn.bot, skyDay.bot, ek);
      skyTop = tmpA; skyMid = tmpB; skyBot = tmpC;
      starsAlpha = lerp(0.2, 0, ek);
      fogD = lerp(0.006, 0.004, ek);
      exposure = 1.05;
      windowEmiss = 0; lampInt = 0;
    } else if (t < 0.72) {
      const k = (t - 0.62) / 0.10;
      camMode = { type: 'orbitDay', k };
      blueprintAlpha = 0;
      buildHeight = TOTAL_H + 4;
      scanAlpha = 0;
      sunIntensity = 2.2; hemiInt = 0.7; moonInt = 0;
      sunDir = { az: lerp(-Math.PI/4, 0, k), el: 0.5 };
      skyTop = skyDay.top; skyMid = skyDay.mid; skyBot = skyDay.bot;
      starsAlpha = 0; fogD = 0.004; exposure = 1.05;
      windowEmiss = 0; lampInt = 0;
    } else if (t < 0.82) {
      const k = (t - 0.72) / 0.10;
      const ek = easeInOut(k);
      camMode = { type: 'orbitSunset', k };
      blueprintAlpha = 0;
      buildHeight = TOTAL_H + 4;
      sunIntensity = lerp(2.2, 0.05, ek);
      hemiInt = lerp(0.7, 0.25, ek);
      moonInt = lerp(0, 0.4, ek);
      sunDir = { az: lerp(0, Math.PI/3, k), el: lerp(0.5, 0.05, ek) };
      lerpColor(tmpA, skyDay.top, skyDusk.top, ek);
      lerpColor(tmpB, skyDay.mid, skyDusk.mid, ek);
      lerpColor(tmpC, skyDay.bot, skyDusk.bot, ek);
      skyTop = tmpA; skyMid = tmpB; skyBot = tmpC;
      starsAlpha = clamp01((k - 0.6) / 0.4) * 0.6;
      fogD = lerp(0.004, 0.012, ek);
      exposure = lerp(1.05, 1.0, ek);
      windowEmiss = clamp01((k - 0.4) / 0.6) * 1.6;
      lampInt = clamp01((k - 0.5) / 0.5) * 1.2;
    } else if (t < 0.93) {
      const k = (t - 0.82) / 0.11;
      const ek = easeInOut(k);
      camMode = { type: 'orbitNight', k };
      blueprintAlpha = 0;
      buildHeight = TOTAL_H + 4;
      sunIntensity = lerp(0.05, 0, ek);
      hemiInt = lerp(0.25, 0.16, ek);
      moonInt = lerp(0.4, 0.55, ek);
      sunDir = { az: Math.PI/3, el: lerp(0.05, -0.1, ek) };
      lerpColor(tmpA, skyDusk.top, skyNight.top, ek);
      lerpColor(tmpB, skyDusk.mid, skyNight.mid, ek);
      lerpColor(tmpC, skyDusk.bot, skyNight.bot, ek);
      skyTop = tmpA; skyMid = tmpB; skyBot = tmpC;
      starsAlpha = lerp(0.6, 0.95, ek);
      fogD = lerp(0.012, 0.018, ek);
      exposure = lerp(1.0, 0.95, ek);
      windowEmiss = 1.6;
      lampInt = 1.2;
    } else if (t < 0.99) {
      const k = (t - 0.93) / 0.06;
      const ek = easeInOut(k);
      camMode = { type: 'tiltOut', k: ek };
      blueprintAlpha = lerp(0, 1, clamp01((k - 0.45) / 0.50));
      planProgress = 1;
      buildHeight = lerp(TOTAL_H + 4, 0, clamp01(k * 1.2));
      scanAlpha = clamp01(k - 0.05) * 0.5;
      scanY = buildHeight;
      sunIntensity = lerp(0, 0.05, ek);
      hemiInt = lerp(0.16, 0.45, ek);
      moonInt = lerp(0.55, 0.5, ek);
      sunDir = { az: -Math.PI/3, el: lerp(-0.1, 0.10, ek) };
      lerpColor(tmpA, skyNight.top, skyBlueprint.top, ek);
      lerpColor(tmpB, skyNight.mid, skyBlueprint.mid, ek);
      lerpColor(tmpC, skyNight.bot, skyBlueprint.bot, ek);
      skyTop = tmpA; skyMid = tmpB; skyBot = tmpC;
      starsAlpha = lerp(0.95, 0.7, ek);
      fogD = lerp(0.018, 0.010, ek);
      exposure = 0.95;
      windowEmiss = lerp(1.6, 0, clamp01(k * 1.5));
      lampInt = lerp(1.2, 0, clamp01(k * 1.5));
    } else {
      camMode = { type: 'plan', k: 0 };
      blueprintAlpha = 1; planProgress = 1;
      buildHeight = 0; scanAlpha = 0;
      sunIntensity = 0.05; hemiInt = 0.45; moonInt = 0.5;
      sunDir = { az: -Math.PI/4, el: 0.10 };
      skyTop = skyBlueprint.top; skyMid = skyBlueprint.mid; skyBot = skyBlueprint.bot;
      starsAlpha = 0.7; fogD = 0.010; exposure = 0.95;
      windowEmiss = 0; lampInt = 0;
    }

    // ----- Camera path -----
    // Each phase is tuned so the relevant subject fills the frame.
    if (camMode.type === 'plan') {
      // Slow dolly-in over the plan — start a bit higher, end closer
      // and pan slightly to the right so the viewer reads the apartments.
      const k = camMode.k;
      const ek = easeInOut(k);
      const y = lerp(46, 36, ek);
      const offsetX = lerp(0, 4, ek);
      camera.position.set(offsetX + 0.001, y, 0.001);
      camera.lookAt(offsetX, 0, 0);
    } else if (camMode.type === 'tiltIn') {
      // Pivot from plan view down to a low oblique looking at the front
      const k = camMode.k;
      const elev = lerp(Math.PI/2, Math.PI/2 - 1.05, k);
      const azim = lerp(0, -Math.PI/4, k);
      const dist = lerp(36, 50, k);
      const ec = Math.cos(elev), es = Math.sin(elev);
      camera.position.set(
        ec * Math.cos(azim) * dist,
        es * dist + 6 * k,
        ec * Math.sin(azim) * dist
      );
      camera.lookAt(0, lerp(0, 12, k), 0);
    } else if (camMode.type === 'orbitRise') {
      // Building rises; camera sweeps around the front-right corner
      const k = camMode.k;
      const elev = Math.PI/2 - 1.05 - k * 0.12;
      const azim = -Math.PI/4 - k * 0.45;
      const dist = lerp(50, 62, k);
      const ec = Math.cos(elev), es = Math.sin(elev);
      camera.position.set(
        ec * Math.cos(azim) * dist,
        es * dist + 10 + k * 12,
        ec * Math.sin(azim) * dist
      );
      camera.lookAt(0, lerp(12, TOTAL_H/2, easeOut(k)), 0);
    } else if (camMode.type === 'orbitDay') {
      // Day: medium-distance orbit showing two faces of the tower
      const k = camMode.k;
      const elev = Math.PI/2 - 1.18;
      const azim = -Math.PI/4 - 0.45 - k * 0.55;
      const dist = lerp(62, 58, k);
      const ec = Math.cos(elev), es = Math.sin(elev);
      camera.position.set(
        ec * Math.cos(azim) * dist,
        es * dist + 18,
        ec * Math.sin(azim) * dist
      );
      camera.lookAt(0, TOTAL_H * 0.45, 0);
    } else if (camMode.type === 'orbitSunset') {
      // Sunset: continue around so the camera ends up looking at the back-right
      const k = camMode.k;
      const elev = Math.PI/2 - 1.18 + k * 0.08;
      const azim = -Math.PI/4 - 1.0 - k * 0.6;
      const dist = lerp(58, 55, k);
      const ec = Math.cos(elev), es = Math.sin(elev);
      camera.position.set(
        ec * Math.cos(azim) * dist,
        es * dist + 18,
        ec * Math.sin(azim) * dist
      );
      camera.lookAt(0, TOTAL_H * 0.45, 0);
    } else if (camMode.type === 'orbitNight') {
      // Night: swing back to the FRONT (azim = -π/2 area, camera at -z) so
      // the lobby + lit windows on the front face dominate the frame.
      const k = camMode.k;
      const ek = easeInOut(k);
      const elev = lerp(Math.PI/2 - 1.10, Math.PI/2 - 1.30, ek);
      // Sweep azim back to roughly -π/2 (camera in front of building)
      const azim = lerp(-Math.PI/4 - 1.6, -Math.PI/2 + 0.05, ek);
      const dist = lerp(55, 42, ek);
      const ec = Math.cos(elev), es = Math.sin(elev);
      camera.position.set(
        ec * Math.cos(azim) * dist,
        es * dist + lerp(18, 12, ek),
        ec * Math.sin(azim) * dist
      );
      camera.lookAt(0, lerp(TOTAL_H * 0.45, TOTAL_H * 0.4, ek), 0);
    } else if (camMode.type === 'tiltOut') {
      const k = camMode.k;
      const elev = lerp(Math.PI/2 - 1.30, Math.PI/2, k);
      const azim = lerp(-Math.PI/2 + 0.05, 0, k);
      const dist = lerp(42, 36, k);
      const ec = Math.cos(elev), es = Math.sin(elev);
      camera.position.set(
        ec * Math.cos(azim) * dist + 0.001,
        es * dist + 12 * (1 - k),
        ec * Math.sin(azim) * dist + 0.001
      );
      camera.lookAt(0, lerp(TOTAL_H/2, 0, k), 0);
    }

    // ----- Apply state -----
    planMat.opacity = blueprintAlpha;
    if (blueprintAlpha > 0.01) {
      updatePlanProgress(planProgress);
    }

    // Clip plane: only points with y < buildHeight visible
    clipPlane.constant = buildHeight;

    // Scan line follows clip plane
    scanLine.position.y = scanY + 0.05;
    scanMat.opacity = scanAlpha;

    // Glass emissive
    glassMat.emissiveIntensity = windowEmiss;
    lobbyMat.emissiveIntensity = windowEmiss * 0.5;

    // Lamps
    lamps.forEach(lp => {
      lp.children.forEach(ch => {
        if (ch.userData.isLamp) {
          ch.material.emissiveIntensity = lampInt * 1.5;
          if (ch.userData.light) ch.userData.light.intensity = lampInt;
        }
      });
    });

    // Sun
    const sx = Math.cos(sunDir.el) * Math.cos(sunDir.az) * 80;
    const sy = Math.sin(sunDir.el) * 80;
    const sz = Math.cos(sunDir.el) * Math.sin(sunDir.az) * 80;
    sun.position.set(sx, Math.max(sy, -10), sz);
    sun.target.position.set(0, 0, 0);
    sun.intensity = sunIntensity;
    hemi.intensity = hemiInt;
    moon.intensity = moonInt;

    // Sky
    skyMat.uniforms.topColor.value.copy(skyTop);
    skyMat.uniforms.midColor.value.copy(skyMid);
    skyMat.uniforms.bottomColor.value.copy(skyBot);
    starMat.opacity = starsAlpha;
    scene.fog.density = fogD;
    renderer.toneMappingExposure = exposure;

    setPhaseLabel(t);
    setProgressDots(t);

    composer.render();
    requestAnimationFrame(tick);
  }

  function setPhaseLabel(t) {
    const el = document.getElementById('phaseLabel');
    let txt;
    if (t < 0.32) txt = '— BLUEPRINT / שרטוט אדריכלי —';
    else if (t < 0.42) txt = '— FOUNDATION / יסודות —';
    else if (t < 0.62) txt = '— FLOOR ' + Math.min(FLOORS, Math.ceil((t - 0.42) / 0.20 * FLOORS)) + ' / קומה —';
    else if (t < 0.72) txt = '— DAYLIGHT / יום —';
    else if (t < 0.82) txt = '— SUNSET / שקיעה —';
    else if (t < 0.93) txt = '— NIGHT / לילה —';
    else if (t < 0.99) txt = '— DAWN / שחר —';
    else txt = '— BLUEPRINT / שרטוט אדריכלי —';
    if (el.textContent !== txt) el.textContent = txt;
  }

  function setProgressDots(t) {
    const phaseEnds = [0.32, 0.62, 0.93, 1.00];
    for (let i = 1; i <= 4; i++) {
      const inner = document.getElementById('dot-' + i);
      const start = i === 1 ? 0 : phaseEnds[i - 2];
      const end = phaseEnds[i - 1];
      const k = clamp01((t - start) / Math.max(0.0001, end - start));
      inner.style.width = (k * 100).toFixed(1) + '%';
    }
  }

  document.getElementById('loader').classList.add('hidden');
  requestAnimationFrame(tick);

})().catch(err => {
  console.error(err);
  const e = document.createElement('div');
  e.className = 'error';
  e.innerHTML = '<div>אירעה שגיאה בטעינת הסצנה.<br/>פרטים בקונסולת הדפדפן.</div>';
  document.body.appendChild(e);
});
</script>
</body>
</html>
